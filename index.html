<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>秘書</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
body{margin:0;font-family:-apple-system,"Hiragino Sans","Meiryo","Yu Gothic UI",sans-serif;font-size:17px;color:#222;background:#f6f7f8}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:2}
header h1{font-size:19px;margin:0 8px 0 0}
header .sel button{border:1px solid #bbb;background:#fff;padding:4px 10px;border-radius:4px;cursor:pointer}
header .sel button.on{background:#222;color:#fff;border-color:#222}
header .st{color:#777;font-size:14px;margin-left:auto}
header .sync{border:1px solid #2b6;color:#2b6;background:#fff;padding:4px 10px;border-radius:4px;cursor:pointer}
main{max-width:1700px;margin:0 auto;padding:10px 12px 60px}
.cols{display:grid;grid-template-columns:1fr;gap:0 14px}
@media(min-width:1100px){.cols{grid-template-columns:1.25fr 1fr}}
.card{position:relative;border:1px solid #e4e4e4;border-radius:6px;padding:6px 34px 6px 10px;margin:6px 0;background:#fbfbfb;line-height:1.45}.card .x{position:absolute;top:6px;right:8px;border:1px solid #ccc;background:#fff;color:#888;border-radius:4px;font-size:13px;line-height:1;padding:3px 6px;cursor:pointer}.card .x:hover{color:#c33;border-color:#c33}.back{border:1px solid #aaa;background:#fff;border-radius:4px;font-size:13px;padding:2px 7px;cursor:pointer;margin-right:4px}.card .t{color:#888;font-size:14px}.card .who{margin:1px 0}.card .s{margin:1px 0}.card .sub{font-size:14px}.card .sub a{color:#25a}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:9;align-items:flex-start;justify-content:center;padding:30px 10px}#ov.on{display:flex}#ov .bx{background:#fff;max-width:900px;width:100%;max-height:90vh;overflow:auto;border-radius:8px;padding:14px 18px;box-shadow:0 8px 30px rgba(0,0,0,.25)}#ov .hd{font-size:14px;color:#666;margin-bottom:8px;white-space:pre-wrap}#ov .bd{white-space:pre-wrap;font-size:16px}#ov .x{float:right;border:1px solid #bbb;background:#fff;border-radius:4px;padding:2px 10px;cursor:pointer}
a.ml{cursor:pointer}
section{background:#fff;border:1px solid #e3e3e3;border-radius:6px;margin:10px 0;padding:8px 12px}
h2{font-size:17px;margin:0 0 6px;display:flex;align-items:center;gap:6px}
h2 .n{background:#222;color:#fff;border-radius:11px;padding:0 8px;font-size:14px}
h2.warn .n{background:#d33}h2.boss .n{background:#c60}
.grp{color:#555;font-size:14px;margin:6px 0 2px}.me{display:inline-block;font-weight:700;color:#333;background:#fff1a8;padding:0 6px;border-radius:3px}.grp .me{font-size:15px}
.row{display:flex;gap:8px;align-items:flex-start;padding:3px 0;border-top:1px solid #f0f0f0}
.row:first-of-type{border-top:0}
.row input{margin-top:3px}.row .b{flex:1;min-width:0}.row .m{font-size:14px;color:#666}.row .s{margin:1px 0}
.row.done .b{opacity:.55;text-decoration:line-through}.donebox{margin-top:8px;border-top:1px dashed #bbb;padding-top:4px}.donebox>summary{display:inline-block;color:#1a7a3a;background:#eaf6ee;border:1px solid #bfe0c8;border-radius:12px;padding:2px 12px;font-size:14px;cursor:pointer;list-style:none}.donebox>summary::-webkit-details-marker{display:none}.donebox[open]>summary{background:#d9efe0}
.tag{display:inline-block;font-size:13px;padding:0 5px;border-radius:3px;background:#eee;color:#444;margin-right:4px}
.tag.rep{background:#e6f5ea;color:#1a7a3a}.tag.ask{background:#ede7ff;color:#5b3fb5}.bt{border:1px solid #5b3fb5;color:#5b3fb5;background:#fff;border-radius:4px;padding:1px 9px;font-size:13px;cursor:pointer;margin-left:6px}.tag.dout{background:#dbe8ff;color:#1a4aa0}.tag.din{background:#ffe4cc;color:#8a4a00}.tag.no{background:#fde8e8;color:#b22}.tag.due{background:#fff3d6;color:#8a5a00}
a{color:#25a;text-decoration:none}
.cnt{font-size:16px;color:#444;line-height:1.7}
.wx{font-size:15px;line-height:1.7;color:#333}.wx b{color:#111}.wx .ty{color:#c00;font-weight:700}.wx .src{color:#999;font-size:12px}
details summary{cursor:pointer;color:#666;font-size:15px}
.empty{color:#999;font-size:15px}
@media(max-width:480px){body{font-size:15px}main{padding:6px}section{padding:6px 8px}}
</style>
</head>
<body>
<header>
  <h1>秘書</h1>
  <span class="sel"><button data-d="1">今日</button><button data-d="3" class="on">3日</button><button data-d="7">1週間</button></span>
  <button class="sync" onclick="syncNow()">今すぐ更新</button>
  <span class="st" id="st"></span>
</header>
<main id="main"><p class="empty">読み込み中…</p></main>
<div id="ov" onclick="if(event.target===this)this.classList.remove('on')"><div class="bx"><button class="x" onclick="document.getElementById('ov').classList.remove('on')">閉じる</button><div class="hd" id="ovh"></div><div class="bd" id="ovb"></div></div></div>
<script>
// 秘書：GAS プロジェクト「秘書」（kototen.office）を API として使う。キーは ?k=（初回のみ、以後は localStorage）
var API='https://script.google.com/macros/s/AKfycbz1HO0bfr65_IhCisT4Q-zR6YZ-mQUEdRx7qfSqHLLoeVsVPCeaL48dn0b9w1xtfYUS/exec';
var K=(new URLSearchParams(location.search).get('k')||'');
try{ if(K) localStorage.setItem('sec_k',K); else K=localStorage.getItem('sec_k')||''; }catch(e){}
var DAYS=3,D=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function me(n){if(!n)return '';if(/^(なし|（なし）|無記名|担当者様?|ご担当者様?|各位)$/.test(n))return esc(n);return '<span class="me">'+esc(n)+'</span>'}
function fmt(d){d=new Date(d);return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function ago(d){var h=(Date.now()-new Date(d))/36e5;return h<1?Math.round(h*60)+'分':h<48?Math.round(h)+'時間':Math.round(h/24)+'日'}
function ml(id,subject){if(String(id).indexOf('fax-')===0)return '<span>'+esc(subject||'FAX')+'</span>';return '<a class="ml" onclick="openMail(\''+id+'\')">'+esc(subject||'(件名なし)')+'</a>'}
function openMail(id){var ov=document.getElementById('ov');document.getElementById('ovh').textContent='読み込み中…';document.getElementById('ovb').textContent='';ov.classList.add('on');
  fetch(API+'?k='+encodeURIComponent(K)+'&a=mail&id='+encodeURIComponent(id)).then(function(r){return r.json()}).then(function(m){
    document.getElementById('ovh').textContent=(m.subject||'(件名なし)')+'\n'+fmt(m.date)+'  '+(m.from||'')+'\n→ '+(m.to||'')+(m.cc?'\ncc '+m.cc:'')+(m.attachments&&m.attachments.length?'\n添付: '+m.attachments.join(', '):'');
    document.getElementById('ovb').textContent=m.body||'';}).catch(function(e){document.getElementById('ovh').textContent='取得失敗 '+e.message})}
function row(r,opt){opt=opt||{};var t='';
  if(r.needsReply){t+=r.replied?'<span class="tag rep">返信済み '+me(r.replied.by)+' '+fmt(r.replied.at)+'</span>':'<span class="tag no">未返信 '+ago(r.date)+'</span>'}
  if(r.due)t+='<span class="tag due">期日 '+esc(r.due).slice(5).replace('-','/')+'</span>';
  if(r.kind&&!opt.nokind)t+='<span class="tag">'+esc(r.kind)+'</span>';
  if(!r.classified)t+='<span class="tag">未分類</span>';
  return '<div class="row'+(r.done?' done':'')+'"><input type="checkbox" '+(r.done?'checked':'')+' onchange="toggle(\''+r.id+'\',this.checked)"><div class="b">'+
    '<div class="m">'+fmt(r.date)+' '+esc(r.company)+(r.fromName&&r.company!==r.fromName?' '+esc(r.fromName.replace(/<.*/,'')):'')+(r.person?' → '+me(r.person):'')+' '+ml(r.id,r.subject)+'</div>'+
    '<div class="s">'+esc(r.summary)+'</div>'+(opt.ask&&r.ask?'<div class="m">確認: '+esc(r.ask)+'</div>':'')+'<div>'+t+(opt.ask?askTags(r):'')+'</div></div></div>'}
function askTags(r){var a=(D.asks||{})[r.id];var h='';
  if(a){h+='<span class="tag ask">聞いた '+fmt(a.askedAt)+'</span>';if(a.answer)h+='<span class="tag rep">'+esc(a.person)+'：'+esc(a.answer)+' '+fmt(a.answeredAt)+'</span>'}
  if(r.person&&!r.done)h+='<button class="bt" onclick="askNow(\''+r.id+'\',this)">'+(a?'もう一度聞く':'聞く')+'</button>';return h}
function askNow(id,btn){btn.disabled=true;btn.textContent='送信中…';
  fetch(API+'?k='+encodeURIComponent(K)+'&a=ask&id='+encodeURIComponent(id)).then(function(r){return r.json()}).then(function(j){
    if(j.error){alert(j.error);btn.disabled=false;btn.textContent='聞く';return}
    D.asks=D.asks||{};D.asks[id]={person:j.person,askedAt:j.askedAt,answer:'',answeredAt:''};render()}).catch(function(e){alert('失敗 '+e.message);btn.disabled=false;btn.textContent='聞く'})}
function sec(title,items,cls,opt){var live=items.filter(function(r){return !r.done}),done=items.filter(function(r){return r.done});
  var h='<section><h2 class="'+(cls||'')+'">'+title+'<span class="n">'+live.length+'</span></h2>';
  if(opt&&opt.group){var g={};live.forEach(function(r){var k=r[opt.group]||'（なし）';(g[k]=g[k]||[]).push(r)});
    Object.keys(g).sort().forEach(function(k){h+='<div class="grp">'+(opt.group==='person'?me(k):esc(k))+'（'+g[k].length+'）</div>'+g[k].map(function(r){return row(r,opt)}).join('')})}
  else h+=live.length?live.map(function(r){return row(r,opt)}).join(''):'<p class="empty">なし</p>';
  if(done.length)h+='<details class="donebox"><summary>✓ 完了 '+done.length+'件（押すと開く）</summary>'+done.map(function(r){return row(r,opt)}).join('')+'</details>';
  return h+'</section>'}
var NOISE=function(r){return r.kind==='営業'||r.kind==='自動応答'};var HID=function(r){return r.kind==='非表示'};
function moves(it,outs){var th={};
  it=it.filter(function(r){return !NOISE(r)});
  it.forEach(function(r){var fn=(r.fromName||'').replace(/<.*/,'').replace(/"/g,'').trim();var co=(r.company||'').replace(/"/g,'').trim();var who=co;if(fn&&fn!==co&&fn.indexOf(co)<0&&co.indexOf(fn)<0)who+=' '+fn;(th[r.threadId]=th[r.threadId]||[]).push({d:r.date,dir:r.dir,who:who,to:r.person,text:r.summary,subject:r.subject,id:r.id,item:r})});
  outs.forEach(function(o){(th[o.threadId]=th[o.threadId]||[]).push({d:o.date,dir:'out',who:o.by||'無記名',to:o.company,text:(o.summary||'').slice(0,50),subject:o.subject,id:o.id})});
  var list=Object.keys(th).map(function(k){var ev=th[k].sort(function(a,b){return a.d<b.d?-1:1});return {last:ev[ev.length-1],n:ev.length,ev:ev}}).sort(function(a,b){return a.last.d<b.last.d?1:-1});
  if(!list.length)return '<section><h2>動き<span class="n">0</span></h2><p class="empty">なし</p></section>';
  var h='<section><h2>動き（スレッド別・新しい順）<span class="n">'+list.length+'</span></h2>';
  list.forEach(function(t){var e=t.last;var lastIn=t.ev.slice().reverse().filter(function(x){return x.dir!=='out'})[0];
    var who=(e.dir==='out'?'<span class="tag dout">こっちから</span>'+me(e.who)+' → '+esc(e.to):'<span class="tag din">あっちから</span>'+esc(e.who)+(e.to?' → '+me(e.to):''));
    var st='';if(lastIn&&lastIn.item&&lastIn.item.needsReply){st=lastIn.item.replied?'<span class="tag rep">返信済み</span>':'<span class="tag no">未返信</span>'}
    if(e.dir==='fax')st+='<span class="tag">FAX</span>';
    if(e.item&&!e.item.classified)st+='<span class="tag">未分類</span>';
    var ids=t.ev.map(function(x){return x.id});
    h+='<div class="card"><button class="x" title="この件を非表示" onclick="hide('+JSON.stringify(ids).replace(/"/g,'&quot;')+',true)">✕</button><div class="t">'+fmt(e.d)+(t.n>1?'・'+t.n+'通':'')+' '+st+'</div><div class="who">'+who+'</div><div class="s">'+esc(e.text)+'</div><div class="sub">'+ml(e.id,e.subject)+'</div></div>'});
  return h+'</section>'}
function render(){var sd=new Date();sd.setDate(sd.getDate()-(DAYS-1));sd.setHours(0,0,0,0);D.since=sd.toISOString();var it=D.items.filter(function(r){return r.date>=D.since&&!HID(r)}),all=D.items.filter(function(r){return !HID(r)});var h='';
  var q=it.filter(function(r){return r.kind==='見積依頼'});var cc={};q.forEach(function(r){cc[r.company]=(cc[r.company]||0)+1});
  h+=sec('見積依頼 '+Object.keys(cc).map(function(k){return esc(k)+' '+cc[k]}).join('・'),q,'',{group:'company',nokind:true});
  h+=moves(it,D.outs.filter(function(o){return o.date>=D.since&&!HID(o)}));
  var hl=h;h='';
  h+=wxSec();
  h+=sec('社長案件',all.filter(function(r){return r.boss}),'boss');
  h+=sec('各自に確認',all.filter(function(r){return r.ask&&!(r.needsReply&&r.replied)}),'',{group:'person',ask:true});
  h+=sec('未返信（相手が答えを待っている）',all.filter(function(r){return r.needsReply&&!r.replied&&r.kind!=='FAX'&&!NOISE(r)}),'warn');
  h+=sec('FAX',it.filter(function(r){return r.dir==='fax'}),'',{nokind:true});
  var pc={};it.forEach(function(r){if(r.dir==='fax'||NOISE(r))return;var p=r.person||'なし';pc[p]=(pc[p]||0)+1});
  var outs=D.outs.filter(function(o){return o.date>=D.since&&!HID(o)});var sent={};outs.forEach(function(o){var b=o.by||'無記名';sent[b]=(sent[b]||0)+1});
  h+='<section><h2>件数</h2><div class="cnt">受信 '+it.filter(function(r){return r.dir!=='fax'&&!NOISE(r)}).length+'件（宛名別: '+Object.keys(pc).sort(function(a,b){return pc[b]-pc[a]}).map(function(k){return me(k)+' '+pc[k]}).join('・')+'）<br>kt-info発 '+outs.length+'件（'+Object.keys(sent).map(function(k){return me(k)+' '+sent[k]}).join('・')+'）</div></section>';
  var hr=h;
  var noise=it.filter(NOISE);
  hl+='<section><details><summary>営業・自動応答（'+noise.length+'件）</summary>'+noise.slice().reverse().map(function(r){return row(r)}).join('')+'</details></section>';
  var hid=D.items.concat(D.outs).filter(HID).sort(function(a,b){return a.date<b.date?1:-1});
  hl+='<section><details><summary>非表示にしたもの（'+hid.length+'件）</summary>'+(hid.length?hid.map(function(r){return '<div class="row"><button class="back" onclick="hide(['+JSON.stringify(r.id).replace(/"/g,'&quot;')+'],false)">戻す</button> '+fmt(r.date)+' '+esc(r.company||r.by||'')+' '+esc((r.subject||'').slice(0,40))+'</div>'}).join(''):'<p class="empty">なし</p>')+'</details></section>';
  hl+='<section><details><summary>受信すべて（期間内 '+it.length+'件）</summary>'+it.slice().reverse().map(function(r){return row(r)}).join('')+'</details></section>';
  document.getElementById('main').innerHTML='<div class="cols"><div>'+hl+'</div><div>'+hr+'</div></div>';
  document.getElementById('st').textContent='更新 '+(D.lastSync?fmt(D.lastSync):'未')}
// 同じ FAX が2件入る（9/10〜 fax.rx の転送が Gmail に2通届く／以前は Mail.app 直読み id=fax-… との二重）ので、受信時刻が3分以内の FAX は1件にまとめる。完了・非表示・宛名は引き継ぐ
function dedupeFax(d){var fx=(d.items||[]).filter(function(r){return r.dir==='fax'}).sort(function(a,b){return a.date<b.date?-1:1});var kept=[],drop={};
  fx.forEach(function(r){var t=new Date(r.date).getTime();var k=null;
    for(var i=kept.length-1;i>=0;i--){if(t-kept[i].t<=180000){k=kept[i].r;break}}
    if(!k){kept.push({t:t,r:r});return}
    drop[r.id]=true;if(r.done)k.done=true;if(r.kind==='非表示')k.kind='非表示';if(!k.person&&r.person)k.person=r.person;if(!k.ask&&r.ask)k.ask=r.ask;if(!k.due&&r.due)k.due=r.due;if(r.needsReply)k.needsReply=true});
  d.items=d.items.filter(function(r){return !drop[r.id]})}

function wxIcon(code,x,y,sc){ // 原寸24px、sc倍で描く
  var sun='<circle cx="12" cy="12" r="5" fill="#f5a623"/><g stroke="#f5a623" stroke-width="2" stroke-linecap="round">'+[0,45,90,135,180,225,270,315].map(function(d){var r=d*Math.PI/180;return '<line x1="'+(12+Math.cos(r)*7.5).toFixed(1)+'" y1="'+(12+Math.sin(r)*7.5).toFixed(1)+'" x2="'+(12+Math.cos(r)*10.5).toFixed(1)+'" y2="'+(12+Math.sin(r)*10.5).toFixed(1)+'"/>'}).join('')+'</g>';
  var cloud=function(fill){return '<path d="M6 17 a4.5 4.5 0 0 1 1-8.9 a6 6 0 0 1 11.4-1.5 a4.5 4.5 0 0 1 0.6 9.4 z" fill="'+fill+'"/>'};

  var snow='<text x="13" y="24" font-size="9" fill="#5b8dd6" text-anchor="middle">＊＊＊</text>';
  var g;
  if(code===0||code===1)g=sun;

function loadWeather(){
