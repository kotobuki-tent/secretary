<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>台帳</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<!-- 台帳（2026-11-13、iller「PWとケータイを独立させたい」）。PW と 社用携帯 の 2 つだけ。秘書・経営とは別のページ、鍵も別。
     PW＝pw.html（業務管理の GAS dept=pw、台帳の鍵 dai_k と暗号の鍵 dai_dk）。携帯＝keitai.html（秘書の GAS、合言葉 sec_k）。
     鍵は ?lk=（台帳の鍵）?ld=（PW の暗号の鍵）?k=（合言葉）で一度だけ受け取り、端末の localStorage に置く。受け取ったら URL から消す。
     このファイルに鍵は無い。使うのは iller・社長・遠藤未来。 -->
<style>
body{margin:0;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;font-size:15px;color:#222;background:#f6f7f8}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:8px 12px;display:flex;gap:8px;align-items:center;z-index:2}
header .tabs{display:flex;gap:4px}
header .tabs button{font:inherit;font-weight:500;border:0;background:#f0f0f2;color:#333;padding:5px 14px;border-radius:6px;cursor:pointer}
header .tabs button.on{background:#d4d4d9;color:#111}
.fr{width:100%;height:calc(100vh - 47px);border:0;display:block;background:#fff}
.fr.off{display:none}
</style>
</head>
<body>
<header><nav class="tabs" id="tabs"><button class="on" data-t="pw" onclick="showTab('pw')">PW</button><button data-t="tel" onclick="showTab('tel')">携帯</button></nav></header>
<iframe id="fr_pw" class="fr off" title="PW"></iframe>
<iframe id="fr_tel" class="fr off" title="社用携帯"></iframe>
<script>
try{ var _q=new URLSearchParams(location.search), _lk=_q.get('lk'), _ld=_q.get('ld'), _k=_q.get('k');
  if(_lk) localStorage.setItem('dai_k',_lk); if(_ld) localStorage.setItem('dai_dk',_ld); if(_k) localStorage.setItem('sec_k',_k);
  if(_lk||_ld||_k){ _q.delete('lk'); _q.delete('ld'); _q.delete('k'); history.replaceState(null,'',location.pathname+(_q.toString()?'?'+_q.toString():'')); }
}catch(e){}
var SRC={pw:'pw.html',tel:'keitai.html'};
function showTab(t){
  if(!SRC[t]) t='pw';
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
  Object.keys(SRC).forEach(function(n){var f=document.getElementById('fr_'+n); f.classList.toggle('off',t!==n); if(t===n&&!f.src) f.src=SRC[n]+'?v='+Date.now();});
  try{localStorage.setItem('dai_tab',t)}catch(e){}
}
var _t='pw'; try{_t=localStorage.getItem('dai_tab')||'pw'}catch(e){}
showTab(_t);
</script>
</body>
</html>
