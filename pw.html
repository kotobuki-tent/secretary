<!doctype html>
<html lang="ja">
<head>
<script>(function(){try{if(!localStorage.getItem('sec_bk')){document.addEventListener('DOMContentLoaded',function(){document.body.innerHTML='<p style="font-family:sans-serif;padding:2em">鍵がありません。秘書の画面を、鍵付きの URL（?bk=…&dk=…）で一度開いてください。</p>'})}}catch(e){}})();</script>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- つなぐ先は業務管理の GAS だけ。外部のスクリプト・フォント・画像は読まない -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>PW管理</title>
<!--
  PW管理（iller と社長専用、2026-10-02）
  ・このファイルには鍵が2つ入っている（GAS に入るための経営の鍵と、中身を暗号にする鍵）。
    リポジトリ・NAS・メール・チャットなど、他人が読める場所に置かない。渡すのは社長だけ。
  ・データは業務管理のシート pw_vault に「暗号にした文字列」で入る。シートを開いても中身は読めない。
  ・暗号の鍵（DK）を失うと中身は取り出せない。このファイルを失くさないこと。
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap');
:root{
  --bg:#f6f7f8; --surface:#fff; --line:#e4e4e4; --text:#222; --dim:#777;
  --accent:#2b6; --accent-ink:#fff; --soft:#f3f4f5; --warn:#c33; --chip:#f0f0f0;
  --shadow:none;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"MS Gothic",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.6 'Hiragino Sans','Noto Sans JP',sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid #bbb;background:#fff;border-radius:4px;padding:4px 10px;white-space:nowrap;font-weight:600}
button:hover{border-color:var(--accent)}
button.pri{background:#222;color:#fff;border-color:#222}
button.danger{color:var(--warn)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{border:1px solid #bbb;background:#fff;border-radius:4px;padding:5px 8px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hidden{display:none!important}

header.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #ddd}
.barin{max-width:none;margin:0;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.barin h1{display:none}
.barin h1 span.mk{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:inline-grid;place-items:center;font-size:14px}
#q{flex:0 1 320px;min-width:160px}
.state{font-size:13px;color:var(--dim);white-space:nowrap;margin-left:auto}
.state.bad{color:var(--warn);font-weight:600;cursor:pointer;text-decoration:underline}
main{max-width:none;margin:0;padding:10px 12px 60px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px}
.chip{border:1px solid #bbb;background:#fff;border-radius:4px;padding:2px 10px;font-size:14px}
.chip.on{background:#222;color:#fff;border-color:#222}
.tw{background:#fbfbfb;border:1px solid var(--line);border-radius:6px;overflow-x:auto}
table.led{width:100%;border-collapse:collapse;font-size:14px}
table.led th{background:#f0f0f0;text-align:left;font-weight:600;font-size:13px;color:var(--dim);padding:5px 10px;white-space:nowrap;cursor:pointer;user-select:none}
table.led th:hover{color:var(--accent)}
table.led th .ar{font-size:10px;margin-left:3px}
table.led th.nosort{cursor:default}
table.led td{padding:5px 10px;border-top:1px solid var(--line);vertical-align:middle}
table.led tr:hover td{background:var(--soft)}
.tag{display:inline-block;padding:0 6px;border-radius:3px;font-size:12px;font-weight:600;background:var(--chip);color:var(--dim);white-space:nowrap}
.nm{font-weight:650;white-space:nowrap}
.nm a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--dim)}
.sub{font-size:13px;color:var(--dim);overflow-wrap:anywhere}
.cp{font-family:var(--mono);font-size:13px;cursor:pointer;padding:2px 5px;margin:-2px -5px;border-radius:3px;display:inline-block;white-space:nowrap}
.cp:hover{background:color-mix(in srgb,var(--accent) 16%,transparent)}
td.memo{font-size:13px;color:var(--dim);min-width:160px;overflow-wrap:anywhere;white-space:pre-wrap}
td.dt{font-size:12px;color:var(--dim);white-space:nowrap}
a.ed{color:#2b6;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
a.ed:hover{text-decoration:underline}
.empty{text-align:center;color:var(--dim);padding:60px 10px}

.bg{position:fixed;inset:0;background:rgba(0,0,0,.42);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border:1px solid #ccc;border-radius:6px;padding:14px 16px}
.dlg h3{margin:0 0 10px;font-size:15px}
.row{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.row label{font-size:13px;color:var(--dim)}
.inline{display:flex;gap:6px;align-items:center}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.foot .left{margin-right:auto}
table.map{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.map th,table.map td{border:1px solid var(--line);padding:5px 7px;text-align:left;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.map th{background:var(--chip);font-weight:600}
table.map select{padding:4px 6px;font-size:12.5px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#222;color:#fff;padding:6px 14px;border-radius:4px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
#toast.on{opacity:1}
menu{position:absolute;right:12px;top:44px;margin:0;padding:4px;list-style:none;background:#fff;border:1px solid #bbb;border-radius:4px;min-width:120px;z-index:10}
menu button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:3px;font-weight:400}
menu button:hover{background:var(--soft)}
</style>
</head>
<body>

<header class="bar"><div class="barin">
  <h1>PW管理</h1>
  <input type="search" id="q" placeholder="検索" autocomplete="off">
  <button class="pri" id="btnAdd" disabled>追加</button>
  <span class="state" id="state">読み込み中…</span>
  <button id="btnReload">更新</button>
  <button id="btnMenu" aria-label="メニュー">⋯</button>
</div>
<menu id="menu" class="hidden">
  <li><button data-act="import">取込</button></li>
  <li><button data-act="csv">書出</button></li>
</menu></header>
<main>
  <div class="chips" id="chips"></div>
  <div id="list"><div class="empty">読み込み中…</div></div>
</main>

<!-- 追加・編集 -->
<div class="bg hidden" id="dlgEdit"><form class="dlg" autocomplete="off">
  <h3 id="edTitle">追加</h3>
  <div class="row"><label>分類</label><input id="edCat" list="catList"><datalist id="catList"></datalist></div>
  <div class="row"><label>名前</label><input id="edName"></div>
  <div class="row"><label>ID</label><input id="edUser" autocomplete="off" spellcheck="false"></div>
  <div class="row"><label>PW</label><div class="inline"><input id="edPw" autocomplete="off" spellcheck="false" style="font-family:var(--mono)"><button type="button" id="edGen">作る</button></div></div>
  <div class="row"><label>URL</label><input id="edUrl" spellcheck="false"></div>
  <div class="row" style="align-items:start"><label>メモ</label><textarea id="edNote" rows="3"></textarea></div>
  <div class="foot">
    <button type="button" class="danger left hidden" id="edDel">削除</button>
    <button type="button" id="edCancel">やめる</button>
    <button type="submit" class="pri">登録</button>
  </div>
</form></div>

<!-- 取り込み -->
<div class="bg hidden" id="dlgImp"><div class="dlg">
  <h3>取込</h3>
  <textarea id="impText" rows="6" placeholder="貼り付け" spellcheck="false" style="font-family:var(--mono);font-size:12px"></textarea>
  <div class="row" style="margin-top:10px"><label>分類（既定）</label><input id="impCat"></div>
  <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:4px 0 2px;cursor:pointer"><input type="checkbox" id="impReplace" style="width:auto">入れ替え</label>
  <div id="impMap"></div>
  <div class="foot">
    <span class="sub left" id="impInfo"></span>
    <button id="impCancel">やめる</button>
    <button class="pri" id="impGo" disabled>取り込む</button>
  </div>
</div></div>

<div id="toast"></div>

<script>
'use strict';
const API='https://script.google.com/macros/s/AKfycbwD5F1rJcdg7pl1lnVXzyY0vttcO88z-YKUZWG3eLIT0DNMhFZw8jXbJoKW6wCIKEC7/exec';
const KEY=(function(){try{return localStorage.getItem('sec_bk')||''}catch(e){return ''}})();   // 経営の鍵（GAS のスクリプトプロパティ BOSS_KEY）。dept=pw の読み書きが通る
const DK=(function(){try{return localStorage.getItem('sec_dk')||''}catch(e){return ''}})();     // 中身を暗号にする鍵。GAS にもシートにも渡さない

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=new TextEncoder(), dec=new TextDecoder();
const b64=u=>{let s='';const a=new Uint8Array(u);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const CID=(()=>{let c='';try{c=localStorage.getItem('pw_cid')||'';if(!c){c='pw-local-'+b64(crypto.getRandomValues(new Uint8Array(3))).replace(/[+/=]/g,'x');localStorage.setItem('pw_cid',c)}}catch(e){c='pw-local'}return c})();

let items=[], ver='', loaded=false, busy=false, lastLoad=0, failedOp=null;
let filter={q:'',cat:''}, sort={col:'cat',asc:true}, editing=null;

// ---- 暗号（AES-GCM 256）----
let _key=null;
async function key(){return _key||(_key=await crypto.subtle.importKey('raw',unb64(DK),'AES-GCM',false,['encrypt','decrypt']))}
async function seal(list){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(),enc.encode(JSON.stringify({v:1,items:list})));return 'v1.'+b64(iv)+'.'+b64(ct)}
async function unseal(blob){const p=String(blob).split('.');if(p[0]!=='v1'||p.length!==3)throw new Error('format');const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(p[1])},await key(),unb64(p[2]));return JSON.parse(dec.decode(pt)).items||[]}

// ---- GAS とのやりとり ----
async function apiRead(){const r=await fetch(API+'?'+new URLSearchParams({dept:'pw',action:'read',key:KEY,cid:CID,t:Date.now()}));return r.json()}
async function apiSave(blob,base){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({dept:'pw',action:'save',key:KEY,cid:CID,base,blob})});return r.json()}
function setState(text,bad){const s=$('state');s.textContent=text;s.classList.toggle('bad',!!bad)}
const hm=()=>new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
function errText(j){return j&&j.error==='auth'?'鍵が通りません（このファイルが古い可能性）':j&&j.error==='too_large'?'件数が多すぎて保存できません':'保存できていません'}

async function load(quiet){
  if(busy)return;busy=true;if(!quiet)setState('読み込み中…');
  try{
    const j=await apiRead();
    if(!j.success){setState(j.error==='auth'?'鍵が通りません（このファイルが古い可能性）':'読み込めません',true);if(!loaded)$('list').innerHTML='<div class="empty">読み込めませんでした。「更新」を押してください</div>';return}
    items=j.blob?await unseal(j.blob):[];ver=j.id||'';loaded=true;lastLoad=Date.now();failedOp=null;
    $('btnAdd').disabled=false;setState('読み込み '+hm());render();
  }catch(e){
    setState(e&&e.message==='format'||e instanceof DOMException?'暗号を開けません（鍵が違うファイル）':'つながりません',true);
    if(!loaded)$('list').innerHTML='<div class="empty">読み込めませんでした。ネットにつながっているか確かめて「更新」を押してください</div>';
  }finally{busy=false}
}
// 変更は「操作」として持ち、相手が先に保存していたら最新を読み直して同じ操作をやり直す
function applyOp(list,op){
  if(op.t==='add')return [...list,op.item];
  if(op.t==='import')return [...list,...op.items];
  if(op.t==='replace')return [...op.items];
  if(op.t==='edit')return list.some(i=>i.id===op.item.id)?list.map(i=>i.id===op.item.id?op.item:i):[...list,op.item];
  if(op.t==='del')return list.filter(i=>i.id!==op.id);
  return list;
}
async function commit(op){
  if(busy){toast('保存中です。少し待ってください');return false}
  busy=true;setState('保存中…');
  const before=items;items=applyOp(items,op);render();
  try{
    for(let n=0;n<3;n++){
      const j=await apiSave(await seal(items),ver);
      if(j.success){ver=j.id;lastLoad=Date.now();failedOp=null;setState('保存済み '+hm());return true}
      if(j.error!=='conflict'){items=before;render();failedOp=op;setState(errText(j)+'（押すとやり直す）',true);return false}
      const r=await apiRead();if(!r.success)break;
      const latest=r.blob?await unseal(r.blob):[];ver=r.id||'';items=applyOp(latest,op);render();toast('相手の変更を取り込んでから保存します');
    }
    items=before;render();failedOp=op;setState('保存できていません（押すとやり直す）',true);return false;
  }catch(e){items=before;render();failedOp=op;setState('保存できていません（押すとやり直す）',true);return false}
  finally{busy=false}
}
$('state').onclick=async()=>{if(failedOp&&!busy){const op=failedOp;failedOp=null;await commit(op)}};
$('btnReload').onclick=()=>{if(failedOp&&!confirm('保存できていない変更があります。捨てて読み直しますか？'))return;load()};
// 画面に戻ってきた時、1分以上たっていれば読み直す（相手の変更を拾う）
function maybeRefresh(){if(!loaded||busy||failedOp||document.hidden)return;if(document.querySelector('.bg:not(.hidden)'))return;if(Date.now()-lastLoad>60000)load(true)}
addEventListener('focus',maybeRefresh);document.addEventListener('visibilitychange',maybeRefresh);
addEventListener('beforeunload',e=>{if(busy||failedOp){e.preventDefault();e.returnValue=''}});

// ---- 表 ----
function cats(){return [...new Set(items.map(i=>i.cat||'その他'))].sort((a,b)=>a.localeCompare(b,'ja'))}
function safeUrl(u){u=String(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u)){if(/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u))u='https://'+u;else return ''}return u}
function render(){
  const cs=cats();
  if(filter.cat&&!cs.includes(filter.cat))filter.cat='';
  $('chips').innerHTML=cs.length>1?['',...cs].map(c=>`<button class="chip${filter.cat===c?' on':''}" data-cat="${esc(c)}">${c?esc(c):'すべて'} <span style="opacity:.6">${c?items.filter(i=>(i.cat||'その他')===c).length:items.length}</span></button>`).join(''):'';
  const q=filter.q.trim().toLowerCase();
  const hit=items.filter(i=>(!filter.cat||(i.cat||'その他')===filter.cat)&&(!q||[i.name,i.user,i.url,i.note,i.cat].some(v=>String(v||'').toLowerCase().includes(q))));
  if(!hit.length){$('list').innerHTML=`<div class="empty">${items.length?'見つかりません':'まだ何もありません。「＋ 追加」から登録します'}</div>`;return}
  const k=i=>sort.col==='cat'?[(i.cat||'その他'),i.name||'']:[String(i[sort.col]||''),i.name||''];
  hit.sort((x,y)=>{const a=k(x),b=k(y);const c=a[0].localeCompare(b[0],'ja')||a[1].localeCompare(b[1],'ja');return sort.asc?c:-c});
  const th=(col,label)=>`<th data-sort="${col}">${label}<span class="ar">${sort.col===col?(sort.asc?'▲':'▼'):''}</span></th>`;
  let h='<div class="tw"><table class="led"><thead><tr>'+th('cat','分類')+th('name','名前')+th('user','ID')+'<th class="nosort">PW</th><th class="nosort">メモ</th>'+th('updated','更新')+'<th class="nosort"></th></tr></thead><tbody>';
  hit.forEach(i=>{
    const url=safeUrl(i.url);
    h+=`<tr data-id="${esc(i.id)}">
      <td><span class="tag">${esc(i.cat||'その他')}</span></td>
      <td class="nm">${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(i.name||'（名前なし）')}</a>`:esc(i.name||'（名前なし）')}</td>
      <td>${i.user?`<span class="cp" data-copy="user" title="押すとコピー">${esc(i.user)}</span>`:''}</td>
      <td>${i.pw?`<span class="cp" data-copy="pw" title="押すとコピー">${esc(i.pw)}</span>`:''}</td>
      <td class="memo">${esc(i.note||'')}</td>
      <td class="dt">${esc(i.updated||'')}</td>
      <td><a class="ed" data-act="edit">編集</a></td>
    </tr>`;
  });
  $('list').innerHTML=h+'</tbody></table></div>';
}
$('q').oninput=e=>{filter.q=e.target.value;render()};
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;filter.cat=b.dataset.cat;render()};
$('list').onclick=e=>{
  const thh=e.target.closest('th[data-sort]');
  if(thh){const c=thh.dataset.sort;if(sort.col===c)sort.asc=!sort.asc;else sort={col:c,asc:true};render();return}
  const tr=e.target.closest('tr[data-id]');if(!tr)return;const it=items.find(i=>i.id===tr.dataset.id);if(!it)return;
  if(e.target.closest('[data-act=edit]')){openEdit(it);return}
  const cp=e.target.closest('[data-copy]');
  if(cp){const v=it[cp.dataset.copy];if(v)copy(v,cp.dataset.copy==='pw'?'PW':'ID')}
};
async function copy(text,label){
  try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
  toast(label+' をコピーしました');
}
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}

// ---- 追加・編集 ----
const uid=()=>b64(crypto.getRandomValues(new Uint8Array(9))).replace(/[+/=]/g,'x');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function openEdit(it){
  editing=it||null;$('edTitle').textContent=it?'編集':'追加';
  $('edName').value=it?it.name||'':'';$('edCat').value=it?it.cat||'':(filter.cat||'');$('edUser').value=it?it.user||'':'';
  $('edPw').value=it?it.pw||'':'';$('edUrl').value=it?it.url||'':'';$('edNote').value=it?it.note||'':'';
  $('catList').innerHTML=cats().map(c=>`<option value="${esc(c)}">`).join('');
  $('edDel').classList.toggle('hidden',!it);$('dlgEdit').classList.remove('hidden');$('edCat').focus();
}
function closeEdit(){$('dlgEdit').classList.add('hidden');editing=null}
$('btnAdd').onclick=()=>openEdit(null);
$('edCancel').onclick=closeEdit;
$('edGen').onclick=()=>{$('edPw').value=gen(20)};
function gen(n){
  const sets=['abcdefghijkmnpqrstuvwxyz','ABCDEFGHJKLMNPQRSTUVWXYZ','23456789','!#$%&*+-=?@_'];const all=sets.join('');
  const rnd=m=>{const lim=256-(256%m);let b;do{b=crypto.getRandomValues(new Uint8Array(1))[0]}while(b>=lim);return b%m};
  const out=sets.map(s=>s[rnd(s.length)]);while(out.length<n)out.push(all[rnd(all.length)]);
  for(let i=out.length-1;i>0;i--){const j=rnd(i+1);[out[i],out[j]]=[out[j],out[i]]}
  return out.join('');
}
$('dlgEdit').querySelector('form').onsubmit=async e=>{
  e.preventDefault();
  const v={name:$('edName').value.trim(),cat:$('edCat').value.trim(),user:$('edUser').value.trim(),pw:$('edPw').value,url:$('edUrl').value.trim(),note:$('edNote').value.trim(),updated:today()};
  if(!v.name&&!v.user){toast('名前か ID を入れてください');return}
  const op=editing?{t:'edit',item:Object.assign({},editing,v)}:{t:'add',item:Object.assign({id:uid()},v)};
  closeEdit();await commit(op);
};
$('edDel').onclick=async()=>{if(!editing||!confirm('「'+(editing.name||editing.user)+'」を削除しますか？'))return;const id=editing.id;closeEdit();await commit({t:'del',id})};

// ---- メニュー ----
$('btnMenu').onclick=e=>{e.stopPropagation();$('menu').classList.toggle('hidden')};

$('menu').onclick=e=>{const a=e.target.closest('[data-act]');if(!a)return;if(!loaded){toast('読み込んでからにしてください');return}if(a.dataset.act==='import')openImport();if(a.dataset.act==='csv')exportCsv()};
function exportCsv(){
  if(!confirm('一覧を CSV に書き出します。パスワードがそのまま読めるファイルになります。続けますか？'))return;
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['分類','名前','ID','PW','URL','メモ','更新日'],...items.map(i=>[i.cat,i.name,i.user,i.pw,i.url,i.note,i.updated])];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}));
  a.download='PW一覧_'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

// ---- Excel から取り込む（貼り付け） ----
const FIELDS=[['','使わない'],['name','名前'],['user','ID'],['pw','PW'],['url','URL'],['note','メモ'],['cat','分類']];
const GUESS=[['pw',/pw|pass|パス|暗証/i],['user',/^id$|id|ユーザ|アカウント|ログイン|メール|mail|アドレス/i],['url',/url|サイト|http|リンク/i],['note',/備考|メモ|note|用途|補足|内容/i],['cat',/分類|種類|カテゴリ/i],['name',/名前|名称|サービス|項目|会社|ソフト|name|区分|名義|担当/i]];
let imp=null;
function parseTsv(t){ // Excel の貼り付け：タブ区切り、マス内の改行は "…" で囲まれる
  const rows=[];let row=[],cell='',inQ=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(inQ){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else inQ=false}else cell+=c}
    else if(c==='"'&&cell==='')inQ=true;
    else if(c==='\t'){row.push(cell);cell=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=c}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c));
}
function openImport(){imp=null;$('impReplace').checked=false;$('impText').value='';$('impCat').value=filter.cat||'';$('impMap').innerHTML='';$('impInfo').textContent='';$('impGo').disabled=true;$('dlgImp').classList.remove('hidden');$('impText').focus()}
function closeImport(){$('dlgImp').classList.add('hidden');$('impText').value='';$('impMap').innerHTML='';imp=null}
$('impCancel').onclick=closeImport;
$('impText').oninput=()=>{
  const rows=parseTsv($('impText').value);
  if(!rows.length){imp=null;$('impMap').innerHTML='';$('impInfo').textContent='';$('impGo').disabled=true;return}
  const n=Math.max(...rows.map(r=>r.length));
  // 見出しの行＝「見出しらしいマス（短くて、ID・PW・URL などの言葉）」が2つ以上ある、最初の行
  const isHead=c=>c&&c.length<=10&&GUESS.some(g=>g[1].test(c));
  const score=rows.map(r=>r.filter(isHead).length);
  const best=Math.max(...score);
  const hi=best>=2?score.indexOf(best):-1;
  const head=hi>=0?rows[hi]:[];
  const map=Array.from({length:n},(_,c)=>{const h=head[c]||'';const g=isHead(h)&&GUESS.find(g=>g[1].test(h));return g?g[0]:''});
  const fill=c=>rows.filter((r,i)=>i!==hi&&r.filter(x=>x).length>=2&&r[c]).length;
  [...new Set(map.filter(m=>m))].forEach(f=>{const cols=map.map((m,i)=>m===f?i:-1).filter(i=>i>=0);const keep=cols.reduce((a,b)=>fill(b)>fill(a)?b:a);cols.forEach(i=>{if(i!==keep)map[i]=''})}); // 同じ項目は1列だけ（字の多い列）
  imp={rows,hi,n,map};drawMap();
};
function drawMap(){
  const {rows,hi,n,map}=imp;
  const body=rows.filter((r,i)=>i!==hi&&r.filter(c=>c).length>=2).slice(0,3);
  let h='<table class="map"><tr>'+map.map((m,c)=>`<th><select data-col="${c}">${FIELDS.map(f=>`<option value="${f[0]}"${f[0]===m?' selected':''}>${f[1]}</option>`).join('')}</select></th>`).join('')+'</tr>';
  if(hi>=0)h+='<tr>'+Array.from({length:n},(_,c)=>`<td class="sub">${esc(rows[hi][c]||'')}</td>`).join('')+'</tr>';
  body.forEach(r=>{h+='<tr>'+Array.from({length:n},(_,c)=>`<td>${esc(r[c]||'')}</td>`).join('')+'</tr>'});
  $('impMap').innerHTML=h+'</table>';
  const list=build();$('impInfo').textContent=list.length+' 件';$('impGo').disabled=!list.length;
}
$('impMap').onchange=e=>{const s=e.target.closest('select');if(!s)return;const c=+s.dataset.col;if(s.value)imp.map.forEach((m,i)=>{if(m===s.value&&i!==c)imp.map[i]=''});imp.map[c]=s.value;drawMap()};
$('impCat').oninput=()=>{if(imp)drawMap()};
function build(){
  const {rows,hi,map}=imp;let cat=$('impCat').value.trim();const out=[];
  if(!map.some(m=>m==='user'||m==='pw'||m==='name'))return out;
  rows.forEach((r,i)=>{
    if(i===hi)return;
    const filled=r.filter(c=>c);
    if(filled.length===1){if(filled[0].length<=24)cat=filled[0];return} // 1マスだけ＝分類の見出し（長い文は注記なので飛ばす）
    if(i<hi)return;                                                 // 見出し行より上（表の題や更新日）は取り込まない
    if(hi>=0&&r.join('\u0001')===rows[hi].join('\u0001'))return;    // 途中でくり返す見出し行
    const it={id:uid(),cat,name:'',user:'',pw:'',url:'',note:'',updated:today()};
    map.forEach((m,c)=>{if(m&&r[c])it[m]=r[c]});
    if(!it.name)it.name=map.includes('name')?(it.cat||it.user):it.user;   // 名前の列がある表はサービス名、無い表（ID と PW だけ）は ID
    if(it.name||it.user||it.pw)out.push(it);
  });
  return out;
}
$('impGo').onclick=async()=>{const list=build();if(!list.length)return;const repl=$('impReplace').checked;if(repl&&!confirm('今ある '+items.length+' 件を全部消して、'+list.length+' 件に入れ替えます。よろしいですか？'))return;closeImport();if(await commit({t:repl?'replace':'import',items:list}))toast(list.length+' 件を取り込みました')};

document.querySelectorAll('.bg').forEach(b=>b.addEventListener('mousedown',e=>{if(e.target===b){if(b.id==='dlgEdit')closeEdit();else closeImport()}}));
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('dlgEdit').classList.contains('hidden'))closeEdit();else if(!$('dlgImp').classList.contains('hidden'))closeImport()}
  if(e.key==='/'&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();$('q').focus()}});

else if(KEY&&DK)load();
