<!DOCTYPE html>
<html lang="ja"><head>
<script>(function(){try{if(!localStorage.getItem('sec_bk')){document.addEventListener('DOMContentLoaded',function(){document.body.innerHTML='<p style="font-family:sans-serif;padding:2em">鍵がありません。秘書の画面を、鍵付きの URL（?bk=…&dk=…）で一度開いてください。</p>'})}}catch(e){}})();</script><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1"><title>寿テント 経営</title>
<!-- 経営者ページ（ローカル版、2026-09-17）。このファイルは経営専用の鍵（読み取りだけ）と人事考課のキーを含む。公開の場所・リポジトリに置かない。
     開くと業務管理API（GAS）から日報・休み・対象者・身元記録を取り、その場で集計する。ファイルを持っている人だけが見られる。 -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap');
:root{--text:#222;--dim:#777;--faint:#999;--border:#e4e4e4;--surface:#fbfbfb;--surface2:#f0f0f0;--accent:#2b6;--green:#2b6;--orange:#e9a;--red:#c33}
body{margin:0;overflow:hidden;background:#f6f7f8;color:var(--text);font:15px/1.45 'Hiragino Sans','Noto Sans JP',sans-serif}
.wrap{max-width:1700px;margin:0 auto;padding:10px 12px 0;box-sizing:border-box;height:100vh;display:flex;flex-direction:column}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;flex:1 1 auto;min-height:0}
.cols>div{overflow-y:auto;min-height:0;padding:0 4px 24px 0;scrollbar-width:thin}
@media(max-width:1000px){body{overflow:auto}.wrap{height:auto;display:block;padding-bottom:60px}.cols{display:block}.cols>div{overflow:visible;padding:0}}
h1{display:none}.sub{color:var(--dim);font-size:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin:0 0 8px}
.card h2{font-size:15px;margin:0 0 6px}
.stats-sub{font-size:15px}.stats-sub b{color:var(--text)}
.stats-note{font-size:13px;color:var(--dim);margin:2px 0 6px}
.stats-list{display:flex;flex-direction:column;gap:6px}
.stats-row{display:flex;align-items:center;gap:10px;padding:3px 6px;border-bottom:1px solid var(--border)}
.stats-rank{width:22px;text-align:center;font-weight:700;color:var(--dim);flex:0 0 auto}
.stats-name{flex:0 0 120px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats-bar-wrap{flex:1;min-width:40px;height:9px;background:var(--surface2);overflow:hidden}
.stats-bar{display:block;height:100%}
.stats-rate{width:46px;text-align:right;font-weight:700;flex:0 0 auto}
.stats-miss{width:92px;text-align:right;font-size:12px;color:var(--dim);flex:0 0 auto}.stats-miss b{color:var(--text)}
.miss-list{display:flex;flex-direction:column;gap:4px}.miss-row{display:flex;gap:10px;padding:3px 6px;border-bottom:1px solid var(--border);font-size:14px}
.miss-day{flex:0 0 104px;font-weight:700}.miss-names{flex:1}.miss-n{color:var(--dim);font-size:12px}.miss-ok{color:var(--green)}
@media(max-width:480px){.stats-name{flex-basis:84px}.stats-miss{width:70px}}
a.btn,button.btn{display:inline-block;padding:4px 10px;border-radius:4px;background:#fff;color:#222;text-decoration:none;font-weight:600;border:1px solid #bbb;font-size:14px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:5px 6px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}th{color:var(--dim);font-weight:600}
.loading{color:var(--faint);padding:20px;text-align:center}.err{color:var(--red)}
td.name{font-weight:600;font-size:13px}td.sub{color:var(--dim)}
.top{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:6px}
.pay td.num{text-align:right;font-variant-numeric:tabular-nums}.pay th.num{text-align:right}.pay tr.sep td{border-top:2px solid var(--border)}
.pay-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--dim)}
.pay-btns{display:flex;gap:6px;flex-wrap:wrap}.pay tr{cursor:pointer}.pay tr:hover td{background:#f8fafc}.pay tr.low td{background:#fef2f2}.pay td.name{white-space:nowrap}
.mo-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;align-items:center;justify-content:center}.mo-bg.show{display:flex}
.mo{background:#fff;border-radius:12px;padding:18px 20px;width:min(560px,94vw);max-height:92vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}.mo h3{margin:0 0 12px;font-size:16px}
.mo label{display:block;font-size:12px;color:var(--dim);margin-bottom:8px}.mo input,.mo select{display:block;width:100%;box-sizing:border-box;margin-top:3px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);background:#fff}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pf-calc{font-size:13px;font-weight:700;margin:4px 0 8px}.pf-hist{font-size:12px;color:var(--dim);max-height:120px;overflow:auto;margin-bottom:6px}.pf-hist .sub{font-weight:700;margin-top:4px}
.mo-btns{display:flex;gap:8px;align-items:center;margin-top:6px}
.btn.sm{padding:3px 9px;font-size:13px}.btn.gray{background:#fff}
</style></head>
<body><div class="wrap">
<div class="top"><span class="sub" id="who"></span><button class="btn sm" onclick="load()">更新</button></div>
<div class="cols"><div>
<div class="card"><h2>日報</h2><div id="stats" class="loading">読み込み中…</div></div>
</div><div>
<div class="card"><h2>人事考課</h2><a class="btn sm" id="hr" target="_blank" rel="noopener">開く</a></div>
<div class="card"><h2>給料台帳</h2>
<div id="pay" class="loading">読み込み中…</div>
<div class="pay-foot"><span id="payMeta"></span><span class="pay-btns"><button class="btn sm" onclick="payEdit(-1)">追加</button><button class="btn sm" onclick="payCfg()">設定</button><label class="btn sm" style="cursor:pointer">読込<input type="file" id="payFile" accept=".xlsx,.json" style="display:none"></label><button class="btn sm" onclick="payExport()">書出</button></span></div></div>
<div class="mo-bg" id="payMo"><div class="mo"><h3 id="payMoTitle">給料</h3>
<div class="f2"><label>氏名<input id="pf_name"></label><label>区分<select id="pf_kind"><option>役員</option><option>執行役員</option><option>社員</option><option>パート</option></select></label></div>
<div class="f2"><label>職位<input id="pf_pos"></label><label>級<input id="pf_grade" type="number" min="1" max="5" inputmode="numeric"></label></div>
<div class="f2"><label>号<input id="pf_step" type="number" min="1" max="51" inputmode="numeric"></label><label>固定額<input id="pf_fixed" type="number" inputmode="numeric"></label></div>
<div class="f2"><label>役職手当<input id="pf_post" type="number" inputmode="numeric"></label><label>資格手当<input id="pf_qual" type="number" inputmode="numeric"></label></div>
<label>備考<input id="pf_note"></label>
<div class="pf-calc" id="pf_calc"></div>
<div id="pf_hist" class="pf-hist"></div>
<div class="mo-btns"><button class="btn sm gray" id="pf_del" onclick="payDel()">この人を消す</button><span style="flex:1"></span><button class="btn sm gray" onclick="payMoClose()">やめる</button><button class="btn sm" onclick="paySaveRow()">保存</button></div>
</div></div>
</div></div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbwD5F1rJcdg7pl1lnVXzyY0vttcO88z-YKUZWG3eLIT0DNMhFZw8jXbJoKW6wCIKEC7/exec';
const KEY=(function(){try{return localStorage.getItem('sec_bk')||''}catch(e){return ''}})();   // 経営専用の鍵（GAS のスクリプトプロパティ BOSS_KEY）。日報の読み取りと身元記録だけ通る。書き込みや他の画面は通らない
const HR_URL='https://script.google.com/macros/s/AKfycbxEehTaaBIJrUp5i-15-_frsMcDVSlR5uAba1JRHnjk1w-j5osgS5RWjrmImbXsZZfX/exec?m=kt-hr-fd6479d152';
const HOLIDAYS={'2025-01-01':1,'2025-01-13':1,'2025-02-11':1,'2025-02-23':1,'2025-02-24':1,'2025-03-20':1,'2025-04-29':1,'2025-05-03':1,'2025-05-04':1,'2025-05-05':1,'2025-05-06':1,'2025-07-21':1,'2025-08-11':1,'2025-09-15':1,'2025-09-23':1,'2025-10-13':1,'2025-11-03':1,'2025-11-23':1,'2025-11-24':1,
'2026-01-01':1,'2026-01-12':1,'2026-02-11':1,'2026-02-23':1,'2026-03-20':1,'2026-04-29':1,'2026-05-03':1,'2026-05-04':1,'2026-05-05':1,'2026-05-06':1,'2026-07-20':1,'2026-08-11':1,'2026-09-21':1,'2026-09-22':1,'2026-09-23':1,'2026-10-12':1,'2026-11-03':1,'2026-11-23':1,
'2027-01-01':1,'2027-01-11':1,'2027-02-11':1,'2027-02-23':1,'2027-03-21':1,'2027-03-22':1,'2027-04-29':1,'2027-05-03':1,'2027-05-04':1,'2027-05-05':1,'2027-07-19':1,'2027-08-11':1,'2027-09-20':1,'2027-09-23':1,'2027-10-11':1,'2027-11-03':1,'2027-11-23':1};
document.getElementById('hr').href=HR_URL;
// 端末の印（cid の先頭6文字）→ 呼び名。新しい端末に名前を付けたい時はここに1行足す
/* 入社日（社員番号→日付）。その日より前は「いま未記入の人」に出さず、記入率の分母にも入れない。途中入社の人が出たらここに足す */
const JOINED={'122':'2026-10-01'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
async function get(p){const r=await fetch(API+'?'+new URLSearchParams({...p,key:KEY,cid:'boss-local'}));return r.json()}
function jst(v){const d=new Date(v);if(isNaN(d))return String(v||'');return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
async function load(){
  document.getElementById('who').textContent='';
  try{
    const todayS=ymd(new Date());
    const today=new Date();today.setHours(0,0,0,0);today.setDate(today.getDate()-1);/* 今日は分母に入れない（朝に開くと全員が未記入1日になるため、前日まで） */const biz=[];
    for(let i=0;i<30;i++){const d=new Date(today);d.setDate(d.getDate()-i);const w=d.getDay(),s=ymd(d);if(w===0||w===6||HOLIDAYS[s])continue;biz.push(s)}
    const bizSet=new Set(biz),from=biz[biz.length-1],to=biz[0],N=biz.length;
    const [st,rp,ab]=await Promise.all([get({dept:'daily',action:'staff_for_daily'}),get({dept:'daily',action:'read',date_from:from,date_to:todayS}),get({dept:'daily',action:'read_absence',date_from:from,date_to:todayS})]);
    if(st.error==='auth'){throw new Error('合言葉が通りません（API_KEY が変わった可能性）')}
    const byEmp={},absBy={};
    (rp.data||[]).forEach(r=>{const e=String(r.employee_no||''),dt=String(r.date||'').slice(0,10);if(!e||!bizSet.has(dt))return;(byEmp[e]=byEmp[e]||new Set()).add(dt)});
    (ab.data||[]).forEach(a=>{const e=String(a.employee_no||''),dt=String(a.date||'').slice(0,10);if(!e||!bizSet.has(dt))return;(absBy[e]=absBy[e]||new Set()).add(dt)});
    /* いま未記入の人（日付ごと）。今日（平日なら）＋直近の営業日5日。日報も休みの登録も無い人を並べる */
    const rpDay={},abDay={};
    (rp.data||[]).forEach(r=>{const e=String(r.employee_no||''),dt=String(r.date||'').slice(0,10);if(e)(rpDay[dt]=rpDay[dt]||new Set()).add(e)});
    (ab.data||[]).forEach(a=>{const e=String(a.employee_no||''),dt=String(a.date||'').slice(0,10);if(e)(abDay[dt]=abDay[dt]||new Set()).add(e)});
    /* 今日の分は終業後（17:30 以降）だけ出す。勤務時間中は「未記入」ではない */
    const nw=new Date(),tw=nw.getDay(),afterWork=nw.getHours()*60+nw.getMinutes()>=17*60+30,days=((tw===0||tw===6||HOLIDAYS[todayS]||!afterWork)?[]:[todayS]).concat(biz.slice(0,5));
    const dlabel=s=>{const d=new Date(s+'T00:00:00');return (d.getMonth()+1)+'/'+d.getDate()+'（'+'日月火水木金土'[d.getDay()]+'）'};
    let mh='<div class="stats-sub" style="font-weight:700">未記入</div><div class="miss-list">';
    days.forEach(d=>{const names=(st.staff||[]).filter(s=>{const k=String(s.employee_no);return !(JOINED[k]&&d<JOINED[k])&&!(rpDay[d]&&rpDay[d].has(k))&&!(abDay[d]&&abDay[d].has(k))}).map(s=>esc(s.name));
      mh+=`<div class="miss-row"><span class="miss-day">${dlabel(d)}</span><span class="miss-names">${names.length?names.join('、')+`<span class="miss-n">（${names.length}人）</span>`:'<span class="miss-ok">全員記入済み</span>'}</span></div>`});
    mh+='</div><div style="height:14px"></div>';
    let rows=(st.staff||[]).map(s=>{const k=String(s.employee_no),j=JOINED[k]||'',absN=[...(absBy[k]||[])].filter(d=>d>=j).length,target=Math.max(0,biz.filter(d=>d>=j).length-absN),done=[...(byEmp[k]||[])].filter(d=>d>=j).length,miss=Math.max(0,target-done);return{name:s.name,done,miss,target,rate:target?Math.round(done/target*100):0}});
    const none=rows.filter(r=>!r.target);rows=rows.filter(r=>r.target);
    rows.sort((a,b)=>b.miss-a.miss||a.rate-b.rate||a.name.localeCompare(b.name,'ja'));
    const tD=rows.reduce((s,r)=>s+r.done,0),tP=rows.reduce((s,r)=>s+r.target,0),overall=tP?Math.round(tD/tP*100):0;
    let h=`<div class="stats-sub" style="font-weight:700;margin-top:10px">30日の記入率 <b>${overall}%</b></div><div class="stats-list">`;
    rows.forEach((r,i)=>{const col=r.rate>=80?'var(--green)':r.rate>=50?'var(--orange)':'var(--red)';h+=`<div class="stats-row"><span class="stats-rank">${i+1}</span><span class="stats-name">${esc(r.name)}</span><span class="stats-bar-wrap"><span class="stats-bar" style="width:${r.rate}%;background:${col}"></span></span><span class="stats-rate">${r.rate}%</span><span class="stats-miss"><b>${r.miss}</b>日</span></div>`});
    if(none.length)h+=`<div class="stats-note" style="margin-top:8px">30日すべて休み：${none.map(r=>esc(r.name)).join('、')}</div>`;
    document.getElementById('stats').className='';document.getElementById('stats').innerHTML=mh+h+'</div>';
    document.getElementById('who').textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  }catch(e){document.getElementById('who').innerHTML='<span class="err">取得に失敗：'+esc(e.message)+'</span>'}
}
// ---- 給料台帳（2026-10-09）。中身はブラウザで暗号にして GAS に預ける（dept=pw&vault=pay、鍵は PW管理 と同じ DK）。GAS もシートも平文を持たない ----
const DK=(function(){try{return localStorage.getItem('sec_dk')||''}catch(e){return ''}})();
const PAY_CID='boss-local';
const _enc=new TextEncoder(),_dec=new TextDecoder();
const _b64=u=>{let t='';const a=new Uint8Array(u);for(let i=0;i<a.length;i++)t+=String.fromCharCode(a[i]);return btoa(t)};
const _unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
let _pk=null;
async function payKey(){return _pk||(_pk=await crypto.subtle.importKey('raw',_unb64(DK),'AES-GCM',false,['encrypt','decrypt']))}
async function paySeal(obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await payKey(),_enc.encode(JSON.stringify(obj)));return 'v1.'+_b64(iv)+'.'+_b64(ct)}
async function payUnseal(blob){const p=String(blob).split('.');if(p[0]!=='v1'||p.length!==3)throw new Error('format');return JSON.parse(_dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:_unb64(p[1])},await payKey(),_unb64(p[2]))))}
async function payRead(){const r=await fetch(API+'?'+new URLSearchParams({dept:'pw',vault:'pay',action:'read',key:KEY,cid:PAY_CID,t:Date.now()}));return r.json()}
async function paySave(blob,base){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({dept:'pw',vault:'pay',action:'save',key:KEY,cid:PAY_CID,base,blob})});return r.json()}

// 新給料表（制度ルール 2026-08-26 確定）。入口と刻みから号の額を出す。1級は 51 号まで（49号＝2級1号）。
const PAY_PITCH=[500,1000,1500,2000,2500];
let payData={v:3,cfg:{entry:176000,partEntry:1090,minWage:1090,hours:161.33},people:[]}, payVer='', payLoaded=false, payBusy=false, payEditing=-1;
function gradeEntry(g){const e=payData.cfg.entry;if(g<=1)return e;let v=200000;for(let i=2;i<g;i++)v+=PAY_PITCH[i-1]*50;return v}
function tableBase(g,n){g=+g;n=+n;if(!(g>=1&&g<=5&&n>=1&&n<=51))return null;return gradeEntry(g)+(n-1)*PAY_PITCH[g-1]}
function partWage(n){n=+n;if(!(n>=1&&n<=30))return null;const e=payData.cfg.partEntry;return n<=10?e+(n-1)*10:e+90+(n-10)*20}
function baseOf(p){if(p.fixed!==''&&p.fixed!=null&&!isNaN(+p.fixed))return +p.fixed;if(p.kind==='パート')return partWage(p.step);if(p.kind==='社員')return tableBase(p.grade,p.step);return null}
const yen=n=>(n==null||n===''||isNaN(+n))?'':Number(n).toLocaleString('ja-JP');
const num=v=>(v===''||v==null)?'':+v;
function payFloor(){return Math.ceil(payData.cfg.minWage*payData.cfg.hours)}
function payRender(){
  const el=document.getElementById('pay'),meta=document.getElementById('payMeta');
  if(!payData.people.length){el.className='loading';el.textContent='まだ誰も入っていません';meta.textContent='';return}
  const floor=payFloor();
  let h='<table class="pay"><tr><th>氏名</th><th>区分</th><th>職位</th><th class="num">級</th><th class="num">号</th><th class="num">基本給／時給</th><th class="num">役職</th><th class="num">資格</th><th class="num">月額</th><th></th></tr>';
  const amt=p=>{const b=baseOf(p);if(b==null)return -1;return p.kind==='パート'?b:b+(num(p.post)||0)+(num(p.qual)||0)};
  payData.people.map((p,i)=>({p,i,a:amt(p)})).sort((x,y)=>y.a-x.a||x.i-y.i).forEach(({p,i})=>{
    const part=p.kind==='パート',b=baseOf(p);
    const low=b!=null&&(part?b<payData.cfg.minWage:(p.kind==='社員'&&b<floor));
    const tot=(b!=null&&!part)?b+(num(p.post)||0)+(num(p.qual)||0):null;
    h+=`<tr class="${low?'low':''}" onclick="payEdit(${i})"><td class="name">${esc(p.name)}</td><td class="sub">${esc(p.kind)}</td><td class="sub">${esc(p.pos)}</td><td class="num">${part?'':esc(p.grade)}</td><td class="num">${esc(p.step)}</td><td class="num">${b==null?'<span class="sub">—</span>':yen(b)}</td><td class="num">${yen(p.post)}</td><td class="num">${yen(p.qual)}</td><td class="num"><b>${tot==null?'':yen(tot)}</b></td><td class="sub">✎</td></tr>`;
  });
  el.className='';el.innerHTML=h+'</table>';
  const lows=payData.people.filter(p=>{const b=baseOf(p);return b!=null&&(p.kind==='パート'?b<payData.cfg.minWage:(p.kind==='社員'&&b<floor))}).length;
  meta.innerHTML=(payData.at?'保存 '+esc(payData.at)+'　':'')+payData.people.length+'人'+(lows?'　<span class="err">最低賃金割れ '+lows+'人</span>':'');
}
async function payLoad(){
  const el=document.getElementById('pay');
  if(!DK){el.className='loading';el.textContent='暗号の鍵（dk）がこの端末にありません';return}
  try{const j=await payRead();if(!j.success){el.className='loading';el.textContent=j.error==='auth'?'鍵が通りません':'読み込めません';return}
    payVer=j.id||'';
    if(j.blob){const d=await payUnseal(j.blob);if(d&&d.people){payData=d;if(!payData.cfg)payData.cfg={entry:176000,partEntry:1090,minWage:1090,hours:161.33}}}
    payLoaded=true;payRender();
  }catch(e){el.className='loading';el.textContent=e&&e.message==='format'||e instanceof DOMException?'暗号を開けません（鍵が違う）':'つながりません'}
}
async function payCommit(){
  if(!payLoaded){alert('まだ読み込めていません');return false}
  if(payBusy)return false;payBusy=true;
  try{
    payData.at=new Date().toLocaleString('ja-JP');
    const blob=await paySeal(payData);
    for(let i=0;i<2;i++){const j=await paySave(blob,payVer);if(j.success){payVer=j.id;payRender();return true}
      if(j.error==='conflict'){const cur=await payRead();payVer=cur.id||'';continue}
      throw new Error(j.error==='auth'?'鍵が通りません':j.error==='too_large'?'大きすぎて保存できません':'保存できません')}
    throw new Error('保存できません（同時に誰かが保存）');
  }catch(e){alert('保存できていません：'+(e&&e.message||e));return false}finally{payBusy=false}
}
// ---- 編集 ----
const $p=id=>document.getElementById(id);
function payCalcShow(){
  const p={kind:$p('pf_kind').value,grade:$p('pf_grade').value,step:$p('pf_step').value,fixed:$p('pf_fixed').value};
  const b=baseOf(p);$p('pf_calc').textContent=b==null?'基本給：—':'基本給：'+yen(b);
}
function payEdit(i){
  payEditing=i;const p=i>=0?payData.people[i]:{name:'',kind:'社員',pos:'一般',grade:'',step:'',fixed:'',post:'',qual:'',note:'',hist:[]};
  $p('payMoTitle').textContent=i>=0?p.name:'人を足す';
  $p('pf_name').value=p.name;$p('pf_kind').value=p.kind;$p('pf_pos').value=p.pos||'';$p('pf_grade').value=p.grade??'';$p('pf_step').value=p.step??'';$p('pf_fixed').value=p.fixed??'';$p('pf_post').value=p.post??'';$p('pf_qual').value=p.qual??'';$p('pf_note').value=p.note||'';
  $p('pf_del').style.display=i>=0?'':'none';
  $p('pf_hist').innerHTML=(p.hist&&p.hist.length)?'<div class="sub">履歴</div>'+p.hist.slice().reverse().map(h=>'<div>'+esc(h.at)+'　'+esc(h.what)+'</div>').join(''):'';
  payCalcShow();$p('payMo').classList.add('show');$p('pf_name').focus();
}
function payMoClose(){$p('payMo').classList.remove('show');payEditing=-1}
['pf_kind','pf_grade','pf_step','pf_fixed'].forEach(id=>$p(id).addEventListener('input',payCalcShow));
async function paySaveRow(){
  const n={name:$p('pf_name').value.trim(),kind:$p('pf_kind').value,pos:$p('pf_pos').value.trim(),grade:num($p('pf_grade').value),step:num($p('pf_step').value),fixed:num($p('pf_fixed').value),post:num($p('pf_post').value),qual:num($p('pf_qual').value),note:$p('pf_note').value.trim()};
  if(!n.name){alert('氏名を入れる');return}
  if(n.kind==='パート')n.grade='';
  const old=payEditing>=0?payData.people[payEditing]:null;
  n.hist=old&&old.hist?old.hist.slice():[];
  const ob=old?baseOf(old):null,nb=baseOf(n);
  const ch=[];
  if(old){ if((old.grade||'')!==(n.grade||'')||(old.step||'')!==(n.step||''))ch.push((old.grade?old.grade+'級':'')+(old.step?old.step+'号':'—')+'→'+(n.grade?n.grade+'級':'')+(n.step?n.step+'号':'—'));
    if(ob!==nb)ch.push('基本給 '+yen(ob)+'→'+yen(nb)); if((old.post||'')!==(n.post||''))ch.push('役職 '+yen(old.post)+'→'+yen(n.post)); if((old.qual||'')!==(n.qual||''))ch.push('資格 '+yen(old.qual)+'→'+yen(n.qual)); if(old.kind!==n.kind)ch.push(old.kind+'→'+n.kind); }
  else ch.push('登録 '+(nb!=null?yen(nb):''));
  if(ch.length)n.hist.push({at:new Date().toLocaleDateString('ja-JP'),what:ch.join('、')});
  const bak=payData.people.slice();
  if(old)payData.people[payEditing]=n;else payData.people.push(n);
  payMoClose();payRender();
  if(!await payCommit()){payData.people=bak;payRender()}
}
async function payDel(){
  if(payEditing<0)return;const p=payData.people[payEditing];
  if(!confirm(p.name+' を消す？'))return;
  const bak=payData.people.slice();payData.people.splice(payEditing,1);payMoClose();payRender();
  if(!await payCommit()){payData.people=bak;payRender()}
}
async function payCfg(){
  const c=payData.cfg;
  const e=prompt('1級1号',c.entry);if(e==null)return;
  const pe=prompt('パート1号',c.partEntry);if(pe==null)return;
  const mw=prompt('最低賃金',c.minWage);if(mw==null)return;
  const bak=Object.assign({},c);payData.cfg={entry:+e||c.entry,partEntry:+pe||c.partEntry,minWage:+mw||c.minWage,hours:c.hours||161.33};
  payRender();if(!await payCommit()){payData.cfg=bak;payRender()}
}
document.getElementById('payFile').addEventListener('change',async ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  try{
    let d,people;
    if(/\.json$/i.test(f.name)){d=JSON.parse(await f.text());people=d.people||d;}
    else{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
      const hi=rows.findIndex(r=>r&&r.indexOf('氏名')>=0);if(hi<0)throw new Error('見出し（氏名）がありません');
      const H=rows[hi],col=n=>H.findIndex(x=>String(x||'').replace(/\s/g,'').indexOf(n)===0);
      const c={name:col('氏名'),kind:col('区分'),pos:col('職位'),grade:col('級'),step:col('号'),base:col('基本給'),post:col('役職'),qual:col('資格'),note:col('備考')};
      const nv=v=>(v==null||v==='')?'':(+String(v).replace(/[,，円]/g,'')||'');
      people=[];const old={};payData.people.forEach(p=>old[p.name]=p);
      rows.slice(hi+1).forEach(r=>{if(!r||!r[c.name])return;const name=String(r[c.name]).trim(),kind=String(r[c.kind]||'社員').trim(),grade=nv(r[c.grade]),step=nv(r[c.step]),base=nv(r[c.base]);
        const fixed=(kind==='社員'&&grade&&step)||(kind==='パート'&&step)?'':base;
        people.push({name,kind,pos:String(r[c.pos]||'').trim(),grade:kind==='パート'?'':grade,step,fixed,post:nv(r[c.post]),qual:nv(r[c.qual]),note:String(r[c.note]||'').trim(),hist:(old[name]&&old[name].hist)||[]});});
      d={cfg:payData.cfg};}
    if(!Array.isArray(people)||!people.length)throw new Error('人の行がありません');
    if(!confirm(people.length+' 人。今の台帳と入れ替える？'))return;
    const bak=payData;payData={v:3,cfg:d.cfg||payData.cfg,people:people.map(p=>Object.assign({hist:[]},p))};
    payRender();if(!await payCommit()){payData=bak;payRender()}
  }catch(e){alert('読み込めません：'+(e&&e.message||e))}
});
function payExport(){
  const floor=payFloor(),amt=p=>{const b=baseOf(p);if(b==null)return -1;return p.kind==='パート'?b:b+(num(p.post)||0)+(num(p.qual)||0)};
  const list=payData.people.map((p,i)=>({p,i,a:amt(p)})).sort((x,y)=>y.a-x.a||x.i-y.i).map(x=>x.p);
  const aoa=[['氏名','区分','職位','級','号','基本給','役職手当','資格手当','月額','備考']];
  list.forEach(p=>{const part=p.kind==='パート',b=baseOf(p);aoa.push([p.name,p.kind,p.pos||'',part?'':(p.grade||''),p.step||'',b==null?'':b,num(p.post)||'',num(p.qual)||'',(b!=null&&!part)?b+(num(p.post)||0)+(num(p.qual)||0):'',p.note||''])});
  const ws=XLSX.utils.aoa_to_sheet(aoa),B='D1D5DB',bd={top:{style:'thin',color:{rgb:B}},bottom:{style:'thin',color:{rgb:B}},left:{style:'thin',color:{rgb:B}},right:{style:'thin',color:{rgb:B}}};
  ws['!cols']=[{wch:13},{wch:8},{wch:8},{wch:4},{wch:4},{wch:10},{wch:9},{wch:9},{wch:10},{wch:34}];
  for(let r=0;r<aoa.length;r++)for(let c=0;c<10;c++){const ref=XLSX.utils.encode_cell({r,c});if(!ws[ref])ws[ref]={t:'s',v:''};
    const numc=c>=3&&c<=8, low=r>0&&(()=>{const p=list[r-1],b=baseOf(p);return b!=null&&(p.kind==='パート'?b<payData.cfg.minWage:(p.kind==='社員'&&b<floor))})();
    ws[ref].s={font:{name:'Meiryo UI',sz:10,bold:r===0||c===8},fill:r===0?{fgColor:{rgb:'E5E7EB'}}:(low?{fgColor:{rgb:'FEE2E2'}}:undefined),alignment:{horizontal:numc?'right':'left',vertical:'center'},border:bd};
    if(r>0&&c>=5&&c<=8&&typeof ws[ref].v==='number')ws[ref].z='#,##0';}
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'給料台帳');
  XLSX.writeFile(wb,'給料台帳_'+new Date().toISOString().slice(0,10)+'.xlsx');
}
