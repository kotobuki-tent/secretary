<script>(function(){try{if(!localStorage.getItem('sec_bk')){document.addEventListener('DOMContentLoaded',function(){document.body.innerHTML='<p style="font-family:sans-serif;padding:2em">鍵がありません。秘書の画面を、鍵付きの URL（?bk=…&dk=…）で一度開いてください。</p>'})}}catch(e){}})();</script><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1"><title>寿テント 経営</title>
<!-- 経営者ページ（ローカル版、2026-09-17）。このファイルは経営専用の鍵（読み取りだけ）と人事考課のキーを含む。公開の場所・リポジトリに置かない。
     開くと業務管理API（GAS）から日報・休み・対象者・身元記録を取り、その場で集計する。ファイルを持っている人だけが見られる。 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--text:#1a1d27;--dim:#6b7280;--faint:#9aa0ad;--border:#e5e7eb;--surface:#fff;--surface2:#f3f4f6;--accent:#3b82f6;--green:#16a34a;--orange:#f59e0b;--red:#dc2626}
body{margin:0;overflow:hidden;background:#f5f6fa;color:var(--text);font:14px/1.5 'Noto Sans JP',-apple-system,'Hiragino Sans','Meiryo',sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:14px 16px 0;box-sizing:border-box;height:100vh;display:flex;flex-direction:column}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;flex:1 1 auto;min-height:0}
.cols>div{overflow-y:auto;min-height:0;padding:0 4px 24px 0;scrollbar-width:thin}
@media(max-width:1000px){body{overflow:auto}.wrap{height:auto;display:block;padding-bottom:60px}.cols{display:block}.cols>div{overflow:visible;padding:0}}
h1{font-size:18px;margin:0 0 4px}.sub{color:var(--dim);font-size:12px;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 10px}
.stats-sub{font-size:14px}.stats-sub b{color:var(--accent)}
.stats-note{font-size:11px;color:var(--dim);margin:2px 0 10px}
.stats-list{display:flex;flex-direction:column;gap:6px}
.stats-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--border);border-radius:8px}
.stats-rank{width:22px;text-align:center;font-weight:700;color:var(--dim);flex:0 0 auto}
.stats-name{flex:0 0 120px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats-bar-wrap{flex:1;min-width:40px;height:14px;background:var(--surface2);border-radius:7px;overflow:hidden}
.stats-bar{display:block;height:100%;border-radius:7px}
.stats-rate{width:46px;text-align:right;font-weight:700;flex:0 0 auto}
.stats-miss{width:92px;text-align:right;font-size:12px;color:var(--dim);flex:0 0 auto}.stats-miss b{color:var(--text)}
.miss-list{display:flex;flex-direction:column;gap:4px}.miss-row{display:flex;gap:10px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px}
.miss-day{flex:0 0 104px;font-weight:700}.miss-names{flex:1}.miss-n{color:var(--dim);font-size:12px}.miss-ok{color:var(--green)}
@media(max-width:480px){.stats-name{flex-basis:84px}.stats-miss{width:70px}}
a.btn,button.btn{display:inline-block;padding:10px 16px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;border:none;font-size:14px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:5px 6px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}th{color:var(--dim);font-weight:600}
tr.rej td{background:#fef2f2}.loading{color:var(--faint);padding:20px;text-align:center}.err{color:var(--red)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
.pill.ok{background:#dcfce7;color:#166534}.pill.ng{background:#fee2e2;color:#991b1b}.pill.old{background:#f3f4f6;color:#6b7280}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pay td.num{text-align:right;font-variant-numeric:tabular-nums}.pay th.num{text-align:right}.pay tr.sep td{border-top:2px solid var(--border)}
.pay-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--dim)}
.btn.sm{padding:6px 12px;font-size:12px}.btn.gray{background:var(--surface2);color:var(--text)}
</style></head>
<body><div class="wrap">
<div class="top"><div><h1>寿テント 経営</h1><div class="sub" id="who">読み込み中…</div></div><button class="btn" onclick="load()">↻ 更新</button></div>
<div class="cols"><div>
<div class="card"><h2>日報の記入状況</h2><div id="stats" class="loading">読み込み中…</div></div>
</div><div>
<div class="card"><h2>人事考課</h2><a class="btn" id="hr" target="_blank" rel="noopener">人事考課を開く（経営）</a></div>
<div class="card"><h2>給料</h2><div class="stats-note">給与台帳（🍅給与・考課/2_毎年の考課/寿テント_給与台帳.xlsx）の「社員マスター」の写し。中身は暗号にして預けてあり、鍵のある端末だけ読める。</div>
<div id="pay" class="loading">読み込み中…</div>
<div class="pay-foot"><span id="payMeta"></span><span><label class="btn sm gray" style="cursor:pointer">台帳を読み込む<input type="file" id="payFile" accept=".xlsx" style="display:none"></label></span></div></div>
<div class="card"><h2>誰がどこから使っているか</h2><div class="stats-note">業務管理を開いた人と端末の一覧（新しい順）。<b style="color:var(--green)">通過</b>＝使えている／<b style="color:var(--red)">拒否</b>＝「認証が切れました」が出ている。</div><div id="who2" class="loading">読み込み中…</div>
<details style="margin-top:12px"><summary style="cursor:pointer;color:var(--dim);font-size:12px">生の記録を見る（直近100件）</summary><div id="auth" style="margin-top:8px"></div></details></div>
</div></div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbwD5F1rJcdg7pl1lnVXzyY0vttcO88z-YKUZWG3eLIT0DNMhFZw8jXbJoKW6wCIKEC7/exec';
const KEY=(function(){try{return localStorage.getItem('sec_bk')||''}catch(e){return ''}})();   // 経営専用の鍵（GAS のスクリプトプロパティ BOSS_KEY）。日報の読み取りと身元記録だけ通る。書き込みや他の画面は通らない
const HR_URL='https://script.google.com/macros/s/AKfycbxEehTaaBIJrUp5i-15-_frsMcDVSlR5uAba1JRHnjk1w-j5osgS5RWjrmImbXsZZfX/exec?m=kt-hr-fd6479d152';
const HOLIDAYS={'2025-01-01':1,'2025-01-13':1,'2025-02-11':1,'2025-02-23':1,'2025-02-24':1,'2025-03-20':1,'2025-04-29':1,'2025-05-03':1,'2025-05-04':1,'2025-05-05':1,'2025-05-06':1,'2025-07-21':1,'2025-08-11':1,'2025-09-15':1,'2025-09-23':1,'2025-10-13':1,'2025-11-03':1,'2025-11-23':1,'2025-11-24':1,
'2026-01-01':1,'2026-01-12':1,'2026-02-11':1,'2026-02-23':1,'2026-03-20':1,'2026-04-29':1,'2026-05-03':1,'2026-05-04':1,'2026-05-05':1,'2026-05-06':1,'2026-07-20':1,'2026-08-11':1,'2026-09-21':1,'2026-09-22':1,'2026-09-23':1,'2026-10-12':1,'2026-11-03':1,'2026-11-23':1,
'2027-01-01':1,'2027-01-11':1,'2027-02-11':1,'2027-02-23':1,'2027-03-21':1,'2027-03-22':1,'2027-04-29':1,'2027-05-03':1,'2027-05-04':1,'2027-05-05':1,'2027-07-19':1,'2027-08-11':1,'2027-09-20':1,'2027-09-23':1,'2027-10-11':1,'2027-11-03':1,'2027-11-23':1};
document.getElementById('hr').href=HR_URL;
// 端末の印（cid の先頭6文字）→ 呼び名。新しい端末に名前を付けたい時はここに1行足す
const DEVICE={ak21ki:'iller のスマホ', n5m54x:'iller の Mac', '5qrcw7':'iller の Mac（別のブラウザ）', n4z6ro:'タブレット①', n2ekjd:'タブレット②', vr50nv:'タブレット③', '786xgy':'事務所 PC', '2ifln2':'社長の PC', jaf9og:'河村の PC', '1x0u3k':'遠藤未来の PC', iyatzz:'牧田の PC（別のブラウザ）', l4nr6w:'牧田の PC', '12b1qx':'森の PC', '6rxcpn':'経理の PC', glky58:'森下の PC', '3fm8f8':'南場の PC', zpud64:'畑の PC', rz6v2t:'竹中の PC', s7j6vw:'河原の PC', i3cqyu:'会長の PC', m1xkee:'iller の MBA', i089x3:'（Claude の検証画面）', 'boss-l':'この経営ページ', 'nippo-':'日報の通知（iMac の自動処理）'};
/* 入社日（社員番号→日付）。その日より前は「いま未記入の人」に出さず、記入率の分母にも入れない。途中入社の人が出たらここに足す */
const JOINED={'122':'2026-10-01'};
const MODE={full:'フル', floor:'現場', kiosk:'点検', local:''};
const SCREEN={production:'生産',project:'現場',cases:'案件',sales:'販売',inventory:'在庫',daily:'日報',overtime:'時間外',attendance:'出勤',alcohol:'点呼',forklift:'リフト',vehicle:'車両',labor:'工数',card:'カード',wb:'ボード',qual:'資格',drive:'製作図',auth:'身元記録'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
async function get(p){const r=await fetch(API+'?'+new URLSearchParams({...p,key:KEY,cid:'boss-local'}));return r.json()}
function jst(v){const d=new Date(v);if(isNaN(d))return String(v||'');return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
async function load(){
  document.getElementById('who').textContent='読み込み中…';
  try{
    const todayS=ymd(new Date());
    const today=new Date();today.setHours(0,0,0,0);today.setDate(today.getDate()-1);/* 今日は分母に入れない（朝に開くと全員が未記入1日になるため、前日まで） */const biz=[];
    for(let i=0;i<30;i++){const d=new Date(today);d.setDate(d.getDate()-i);const w=d.getDay(),s=ymd(d);if(w===0||w===6||HOLIDAYS[s])continue;biz.push(s)}
    const bizSet=new Set(biz),from=biz[biz.length-1],to=biz[0],N=biz.length;
    const [st,rp,ab,al]=await Promise.all([get({dept:'daily',action:'staff_for_daily'}),get({dept:'daily',action:'read',date_from:from,date_to:todayS}),get({dept:'daily',action:'read_absence',date_from:from,date_to:todayS}),get({dept:'auth',action:'log',n:500})]);
    if(st.error==='auth'){throw new Error('合言葉が通りません（API_KEY が変わった可能性）')}
    const byEmp={},absBy={};
    (rp.data||[]).forEach(r=>{const e=String(r.employee_no||''),dt=String(r.date||'').slice(0,10);if(!e||!bizSet.has(dt))return;(byEmp[e]=byEmp[e]||new Set()).add(dt)});
    (ab.data||[]).forEach(a=>{const e=String(a.employee_no||''),dt=String(a.date||'').slice(0,10);if(!e||!bizSet.has(dt))return;(absBy[e]=absBy[e]||new Set()).add(dt)});
    /* いま未記入の人（日付ごと）。今日（平日なら）＋直近の営業日5日。日報も休みの登録も無い人を並べる */
    const rpDay={},abDay={};
    (rp.data||[]).forEach(r=>{const e=String(r.employee_no||''),dt=String(r.date||'').slice(0,10);if(e)(rpDay[dt]=rpDay[dt]||new Set()).add(e)});
    (ab.data||[]).forEach(a=>{const e=String(a.employee_no||''),dt=String(a.date||'').slice(0,10);if(e)(abDay[dt]=abDay[dt]||new Set()).add(e)});
    /* 今日の分は終業後（17:30 以降）だけ出す。勤務時間中は「未記入」ではない */
    const nw=new Date(),tw=nw.getDay(),afterWork=nw.getHours()*60+nw.getMinutes()>=17*60+30,days=((tw===0||tw===6||HOLIDAYS[todayS]||!afterWork)?[]:[todayS]).concat(biz.slice(0,5));
    const dlabel=s=>{const d=new Date(s+'T00:00:00');return (d.getMonth()+1)+'/'+d.getDate()+'（'+'日月火水木金土'[d.getDay()]+'）'};
    let mh='<div class="stats-sub" style="font-weight:700">いま未記入の人</div><div class="stats-note">この画面を開いた時点。日報も休みの登録も無い人。今日の分は 17:30 を過ぎてから出ます。土日祝に出た人はここには出ません。</div><div class="miss-list">';
    days.forEach(d=>{const names=(st.staff||[]).filter(s=>{const k=String(s.employee_no);return !(JOINED[k]&&d<JOINED[k])&&!(rpDay[d]&&rpDay[d].has(k))&&!(abDay[d]&&abDay[d].has(k))}).map(s=>esc(s.name));
      mh+=`<div class="miss-row"><span class="miss-day">${d===todayS?'今日 ':''}${dlabel(d)}</span><span class="miss-names">${names.length?names.join('、')+`<span class="miss-n">（${names.length}人）</span>`:'<span class="miss-ok">全員記入済み</span>'}</span></div>`});
    mh+='</div><div style="height:14px"></div>';
    let rows=(st.staff||[]).map(s=>{const k=String(s.employee_no),j=JOINED[k]||'',absN=[...(absBy[k]||[])].filter(d=>d>=j).length,target=Math.max(0,biz.filter(d=>d>=j).length-absN),done=[...(byEmp[k]||[])].filter(d=>d>=j).length,miss=Math.max(0,target-done);return{name:s.name,done,miss,target,rate:target?Math.round(done/target*100):0}});
    const none=rows.filter(r=>!r.target);rows=rows.filter(r=>r.target);
    rows.sort((a,b)=>b.miss-a.miss||a.rate-b.rate||a.name.localeCompare(b.name,'ja'));
    const tD=rows.reduce((s,r)=>s+r.done,0),tP=rows.reduce((s,r)=>s+r.target,0),overall=tP?Math.round(tD/tP*100):0;
    let h=`<div class="stats-sub">直近30日の営業日 <b>${N}日</b>（${from}〜${to}、土日祝を除く・前日まで）／ 全体記入率 <b>${overall}%</b></div><div class="stats-note">※出勤日ベース。欠勤日は除外して計算。日報が1件でもある日を「記入」とカウント。</div><div class="stats-list">`;
    rows.forEach((r,i)=>{const col=r.rate>=80?'var(--green)':r.rate>=50?'var(--orange)':'var(--red)';h+=`<div class="stats-row"><span class="stats-rank">${i+1}</span><span class="stats-name">${esc(r.name)}</span><span class="stats-bar-wrap"><span class="stats-bar" style="width:${r.rate}%;background:${col}"></span></span><span class="stats-rate">${r.rate}%</span><span class="stats-miss">未記入 <b>${r.miss}</b>日</span></div>`});
    if(none.length)h+=`<div class="stats-note" style="margin-top:8px">対象日なし（30日すべて休み）：${none.map(r=>esc(r.name)).join('、')}</div>`;
    document.getElementById('stats').className='';document.getElementById('stats').innerHTML=mh+h+'</div>';
    // 人・端末ごとにまとめる（LINE WORKS は人の名前、合言葉は端末の呼び名、身元なしは「未登録の端末」）
    const grp={};
    (al.data||[]).forEach(r=>{
      const cid=String(r.cid||''), id6=cid.slice(0,6), mode=(cid.split('-')[1]||'');
      if(/^(test-|claude-|t$)/.test(cid)||id6==='boss-l'||id6==='i089x3')return;   // 検証用と自分自身は出さない
      const who=String(r.who||'').split('|')[0], rej=(r.reject===true||String(r.reject)==='true');
      let key,label,via;
      if(r.how==='woff'&&who&&who[0]!=='!'){ key='p:'+who; label=who; via='スマホ（LINE WORKS）'; }
      else if(cid){ key='d:'+id6; label=''; via=(r.how==='key'&&r.ok)?'合言葉':(r.how==='boss'?(r.ok?'経営の鍵（読み取りだけ）':'経営の鍵（範囲外で拒否）'):(r.how==='woff'?'LINE WORKS の期限切れ':(r.how==='key'?'合言葉が違う':'身元なし'))); }   // 同じ端末は、拒否の時期と通過の時期を1行にまとめる
      else { key='old'; label='古い版のままの端末（複数）'; via='身元なし'; }
      const g=grp[key]=grp[key]||{label,via,last:0,lastRej:false,ok:0,ng:0,screens:{},mode:'',id6};
      const t=new Date(r.at).getTime()||0;
      if(t>=g.last){ g.last=t; g.lastRej=rej; g.via=via; g.mode=MODE[mode]||''; }
      rej?g.ng++:g.ok++; g.screens[SCREEN[r.dept]||r.dept]=1;
    });
    const list=Object.values(grp).sort((a,b)=>b.last-a.last);
    list.forEach(g=>{ if(!g.label) g.label=DEVICE[g.id6]||((g.lastRej?'未登録の端末（':'名前の無い端末（')+g.id6+'）'); });
    let w='<table><tr><th>誰・どの端末</th><th>入り方</th><th>最後に使った</th><th>状態</th><th>開いた画面</th></tr>';
    list.forEach(g=>{ const st=g.lastRej?'<span class="pill ng">拒否</span>':'<span class="pill ok">通過</span>';
      w+=`<tr><td class="name">${esc(g.label)}</td><td class="sub">${esc(g.via)}${g.mode?'・'+esc(g.mode):''}</td><td class="sub">${esc(jst(g.last))}</td><td>${st}${g.ng&&!g.lastRej?' <span class="pill old">前に拒否 '+g.ng+'回</span>':''}</td><td class="sub">${esc(Object.keys(g.screens).join('・'))}</td></tr>`; });
    document.getElementById('who2').className=''; document.getElementById('who2').innerHTML=list.length?w+'</table>':'記録がありません';
    let a='<table><tr><th>時刻</th><th>dept</th><th>action</th><th>how</th><th>who</th><th>ok</th><th>cid</th></tr>';
    (al.data||[]).slice(-100).reverse().forEach(r=>{a+=`<tr class="${r.reject===true||String(r.reject)==='true'?'rej':''}"><td>${esc(jst(r.at))}</td><td>${esc(r.dept)}</td><td>${esc(r.action)}</td><td>${esc(r.how)}</td><td>${esc(String(r.who||'').split('|')[0])}</td><td>${esc(r.ok)}</td><td>${esc(r.cid)}</td></tr>`});
    document.getElementById('auth').className='';document.getElementById('auth').innerHTML=a+'</table>';
    document.getElementById('who').textContent='更新 '+new Date().toLocaleString('ja-JP');
  }catch(e){document.getElementById('who').innerHTML='<span class="err">取得に失敗：'+esc(e.message)+'</span>'}
}
// ---- 給料（台帳の写し、暗号で GAS に預ける。dept=pw&vault=pay、鍵は PW管理 と同じ DK）----
const DK=(function(){try{return localStorage.getItem('sec_dk')||''}catch(e){return ''}})();
const PAY_CID='boss-local';
const _enc=new TextEncoder(),_dec=new TextDecoder();
const _b64=u=>{let t='';const a=new Uint8Array(u);for(let i=0;i<a.length;i++)t+=String.fromCharCode(a[i]);return btoa(t)};
const _unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
let _pk=null;
async function payKey(){return _pk||(_pk=await crypto.subtle.importKey('raw',_unb64(DK),'AES-GCM',false,['encrypt','decrypt']))}
async function paySeal(obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await payKey(),_enc.encode(JSON.stringify(obj)));return 'v1.'+_b64(iv)+'.'+_b64(ct)}
async function payUnseal(blob){const p=String(blob).split('.');if(p[0]!=='v1'||p.length!==3)throw new Error('format');return JSON.parse(_dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:_unb64(p[1])},await payKey(),_unb64(p[2]))))}
async function payRead(){const r=await fetch(API+'?'+new URLSearchParams({dept:'pw',vault:'pay',action:'read',key:KEY,cid:PAY_CID,t:Date.now()}));return r.json()}
async function paySave(blob,base){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({dept:'pw',vault:'pay',action:'save',key:KEY,cid:PAY_CID,base,blob})});return r.json()}
const yen=n=>(n==null||n==='')?'':Number(n).toLocaleString('ja-JP');
function payRender(d){
  const el=document.getElementById('pay'),meta=document.getElementById('payMeta');
  if(!d||!d.items||!d.items.length){el.className='loading';el.textContent='まだ台帳を読み込んでいません';meta.textContent='';return}
  let h='<table class="pay"><tr><th>氏名</th><th>職位</th><th>区分</th><th class="num">級</th><th class="num">号</th><th class="num">基本給／時給</th><th class="num">役職</th><th class="num">資格</th><th class="num">月額</th></tr>';
  let prev='';
  d.items.forEach(r=>{
    const part=/パート/.test(r.kind||''), tot=part?'':yen((+r.base||0)+(+r.post||0)+(+r.qual||0));
    h+=`<tr class="${prev&&prev!==r.kind?'sep':''}"><td class="name">${esc(r.name)}</td><td class="sub">${esc(r.pos)}</td><td class="sub">${esc(r.kind)}</td><td class="num">${esc(r.grade)}</td><td class="num">${esc(r.step)}</td><td class="num">${yen(r.base)}${part?' <span class="sub">/h</span>':''}</td><td class="num">${yen(r.post)}</td><td class="num">${yen(r.qual)}</td><td class="num"><b>${tot}</b></td></tr>`;
    prev=r.kind;
  });
  el.className='';el.innerHTML=h+'</table>';
  meta.textContent=(d.src?d.src+'　':'')+(d.at?'読み込み '+d.at:'')+'　'+d.items.length+'人';
}
async function payLoad(){
  const el=document.getElementById('pay');
  if(!DK){el.className='loading';el.textContent='暗号の鍵（dk）がこの端末にありません';return}
  try{const j=await payRead();if(!j.success){el.className='loading';el.textContent=j.error==='auth'?'鍵が通りません':'読み込めません';return}
    payRender(j.blob?await payUnseal(j.blob):null);
  }catch(e){el.className='loading';el.textContent=e&&e.message==='format'||e instanceof DOMException?'暗号を開けません（鍵が違う）':'つながりません'}
}
function payParse(buf){
  const wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets['社員マスター'];
  if(!ws)throw new Error('「社員マスター」のシートがありません');
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
  let hi=rows.findIndex(r=>r&&r[0]==='氏名');if(hi<0)throw new Error('見出し（氏名）が見つかりません');
  const H=rows[hi],col=n=>H.findIndex(x=>String(x||'').indexOf(n)===0);
  const c={name:col('氏名'),pos:col('職位'),kind:col('区分'),grade:col('級'),step:col('号'),base:col('基本給'),post:col('役職手当'),qual:col('資格手当'),note:col('備考')};
  const items=[];
  for(const r of rows.slice(hi+1)){
    if(!r||!r[c.name])continue;
    const kind=String(r[c.kind]||'');if(/退職/.test(kind))continue;
    items.push({name:String(r[c.name]).trim(),pos:r[c.pos]||'',kind,grade:r[c.grade]??'',step:r[c.step]??'',base:r[c.base]??'',post:r[c.post]??'',qual:r[c.qual]??'',note:r[c.note]||''});
  }
  if(!items.length)throw new Error('人の行がありません');
  return items;
}
document.getElementById('payFile').addEventListener('change',async ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  const el=document.getElementById('pay');
  try{
    const items=payParse(await f.arrayBuffer());
    if(!confirm(items.length+' 人を読み込みました。今の表と入れ替えますか？'))return;
    el.className='loading';el.textContent='保存中…';
    const d={v:1,src:f.name,at:new Date().toLocaleString('ja-JP'),items},blob=await paySeal(d);
    for(let i=0;i<2;i++){const cur=await payRead();const j=await paySave(blob,cur.id||'');if(j.success){payRender(d);return}if(j.error!=='conflict')throw new Error(j.error==='auth'?'鍵が通りません':j.error==='too_large'?'大きすぎて保存できません':'保存できません')}
    throw new Error('保存できません（同時に誰かが保存）');
  }catch(e){alert('読み込めません：'+(e&&e.message||e));payLoad()}
});
if(KEY){load();payLoad()}
</script></body></html>
