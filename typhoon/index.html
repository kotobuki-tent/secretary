<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台風の進路予想（気象庁・JTWC・各国モデル）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f2f2f7;--surface:#fff;--text:#1c1c1e;--dim:#6e6e73;--border:#d9d9de;--accent:#2f6fed}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;position:relative}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:700}
header .sub{color:var(--dim);font-size:12px}
header select{border:1px solid var(--border);border-radius:8px;padding:5px 8px;font:inherit;background:#fff}
#map{flex:1;min-height:320px}
/* 操作は地図の上に浮かぶ札（10/22 iller「下のスライダーやらチップがタスクバーみたいすぎて気づかない」）*/
.bar{position:absolute;right:16px;bottom:38px;z-index:1000;max-width:640px;background:rgba(255,255,255,.96);border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 32px rgba(0,0,0,.28);padding:12px 18px 14px}
.time{display:flex;align-items:center;gap:12px}
.time b{min-width:120px;font-size:17px;font-variant-numeric:tabular-nums}
.time .sl{flex:1;position:relative;padding-bottom:18px}
.time .sl input[type=range]{display:block;width:100%;margin:0}
/* 目盛：日付の変わり目に日付、12 時に小さな印（10/22 iller「目安の目盛」） */
.ticks{position:absolute;left:14px;right:14px;top:26px;height:18px}
.tick{position:absolute;top:0;transform:translateX(-50%);font-size:10px;line-height:1;color:var(--dim);white-space:nowrap;text-align:center}
.tick::before{content:'';display:block;width:1px;height:5px;background:#9a9aa0;margin:0 auto 3px}
.tick.minor::before{height:3px;background:#c4c4c9}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--border);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer;background:#f2f2f7;user-select:none}
.chip i{width:14px;height:3px;border-radius:2px;display:inline-block}
.chip.off{opacity:.45;background:#fff;font-weight:400;border-style:dashed}
.chip small{color:var(--dim)}
.leaflet-container{font:inherit}
.lbl{background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;white-space:nowrap}
.now{background:#fff;border:2px solid #000;border-radius:50%;width:12px;height:12px;margin:-6px 0 0 -6px}
@media(max-width:600px){
  header{padding:6px 12px;gap:8px;flex-wrap:nowrap;overflow:hidden}
  header h1{font-size:15px;white-space:nowrap}
  header .sub{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #upd{display:none}
  .bar{position:static;max-width:none;background:var(--surface);border:none;border-top:1px solid var(--border);border-radius:0;box-shadow:none;padding:6px 10px calc(8px + env(safe-area-inset-bottom))}   /* スマホは下の帯のまま（iller「スマホはいいと思うが」） */
  .time b{font-size:13px}
  .chip{background:#fff;font-weight:400;border-width:1px}.chip.off{border-style:solid;opacity:.35}
  .time{gap:8px}.time b{min-width:84px;font-size:13px}
  .time input[type=range]{height:28px}
  .chips{gap:4px;margin-top:6px}
  .chip{font-size:11px;padding:2px 8px;gap:4px}.chip small{font-size:10px}
  .lbl{font-size:10px;padding:0 4px}
  .leaflet-control-zoom{display:none}
}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#cfd3da}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--accent);margin-top:-11px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div id="app">
<header>
  <h1 id="ttl">台風</h1>
  <span class="sub" id="iss"></span>
  <select id="pick" style="display:none"></select>
  <span class="sub" style="margin-left:auto" id="upd"></span>
</header>
<div id="map"></div>
<div class="bar">
  <div class="time"><b id="tlabel">—</b><div class="sl"><input type="range" id="slider" min="0" max="0" value="0" step="1"><div class="ticks" id="ticks"></div></div></div>
  <div class="chips" id="chips"></div>
</div>
</div>
<script>
const SRC=[
  {key:'jma',  label:'気象庁',   color:'#1a4fd6', width:4},
  {key:'jtwc', label:'米軍 JTWC', color:'#f28c1a', width:3},
  {key:'UKM',  label:'UKMET',   color:'#19a7a0', width:2.5},
  {key:'CMC',  label:'CMC',     color:'#8e44ad', width:2.5},
  {key:'NGX',  label:'NAVGEM',  color:'#c0392b', width:2.5},
  {key:'AVNO', label:'GFS',     color:'#2e7d32', width:2.5},
  {key:'GFSO', label:'GFS',     color:'#2e7d32', width:2.5},
  {key:'EMXI', label:'ECMWF',   color:'#000',    width:2.5},
  {key:'AEMN', label:'GEFS 平均', color:'#2e7d32', width:2, dash:'6 6'},
  {key:'CEMN', label:'CMC 平均',  color:'#8e44ad', width:2, dash:'6 6'},
  {key:'NEMN', label:'NAVGEM 平均', color:'#c0392b', width:2, dash:'6 6'},
  {key:'TVCN', label:'総合',     color:'#111',    width:3, dash:'2 6'},
  {key:'CONW', label:'総合',     color:'#111',    width:3, dash:'2 6'},
];
const STALE_H=36;   // これより古い初期時刻のモデルは薄く
const DEFAULT_ON=['jma','jtwc','AEMN'];
let data=null, storm=null, map, layers={}, markers={}, times=[], on={};
const pad=n=>String(n).padStart(2,'0');
const fmtJ=d=>`${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}時`;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function utc(s){ return new Date(s); }
function series(key){   // → {init:Date, pts:[{t:Date,lat,lon,r,kt}], stale}
  if(key==='jma'){ const p=storm.jma.points; if(!p.length) return null; return {init:new Date(p[0].valid), pts:p.map(x=>({t:new Date(x.valid),lat:x.lat,lon:x.lon,r:x.r,pres:x.pres,wind:x.wind,h:x.h,gale:x.gale||[],storm:x.storm||[]})), label:'気象庁 '+fmtJ(new Date(storm.jma.issue))+' 発表'}; }
  if(key==='jtwc'){ const w=storm.jtwc; if(!w) return null; const i=utc(w.init_utc); return {init:i, pts:w.points.map(x=>({t:new Date(i.getTime()+x.h*3600e3),lat:x.lat,lon:x.lon,kt:x.kt,h:x.h,rad:x.r||{}})), label:'JTWC '+fmtJ(i)+' 初期'}; }
  const m=storm.models[key]; if(!m) return null; const i=utc(m.init_utc);
  return {init:i, pts:m.points.map(x=>({t:new Date(i.getTime()+x.h*3600e3),lat:x.lat,lon:x.lon,kt:x.kt,h:x.h})), label:m.label+' '+fmtJ(i)+' 初期', stale:(Date.now()-i.getTime())>STALE_H*3600e3};
}
// 方位ごとの半径（km）から多角形。sectors=[[from,to,km]...]（方位は北 0°時計回り）
function windPoly(lat,lon,sectors,opt){ const R=6371, pts=[]; for(let b=0;b<=360;b+=5){ let km=0; for(const [f,t,k] of sectors){ const bb=((b%360)+360)%360; const inSec=f<=t?(bb>=f&&bb<t):(bb>=f||bb<t); if(inSec){km=k;break;} } if(!km){pts.push(null);continue;} const br=b*Math.PI/180, la=lat*Math.PI/180, lo=lon*Math.PI/180, d=km/R; const la2=Math.asin(Math.sin(la)*Math.cos(d)+Math.cos(la)*Math.sin(d)*Math.cos(br)); const lo2=lo+Math.atan2(Math.sin(br)*Math.sin(d)*Math.cos(la),Math.cos(d)-Math.sin(la)*Math.sin(la2)); pts.push([la2*180/Math.PI,lo2*180/Math.PI]); }
  const ll=pts.filter(Boolean); if(ll.length<3) return null; return L.polygon(ll,Object.assign({weight:1.2,fillOpacity:.12,interactive:false},opt)); }
const JMA_SEC={'北東':[315,135],'南西':[135,315],'東':[0,180],'西':[180,360],'北':[270,90],'南':[90,270],'北西':[225,45],'南東':[45,225],'全域':[0,360]};
function jmaSectors(list){ return (list||[]).filter(x=>x.km).map(x=>{ const r=JMA_SEC[x.area]||[0,360]; return [r[0],r[1],x.km]; }); }
function jtwcSectors(arr){ return arr?[[0,90,arr[0]],[90,180,arr[1]],[180,270,arr[2]],[270,360,arr[3]]]:[]; }
function interp(pts,t){ if(!pts.length) return null; if(t<=pts[0].t) return t>=pts[0].t-1 ? pts[0] : null; for(let i=1;i<pts.length;i++){ if(t<=pts[i].t){ const a=pts[i-1],b=pts[i],f=(t-a.t)/(b.t-a.t); return {lat:a.lat+(b.lat-a.lat)*f, lon:a.lon+(b.lon-a.lon)*f}; } } return null; }
function build(){
  Object.values(layers).forEach(l=>map.removeLayer(l)); layers={}; Object.values(markers).forEach(l=>map.removeLayer(l)); markers={};
  const chips=document.getElementById('chips'); chips.innerHTML='';
  // 過去の経路
  if(storm.jma.past&&storm.jma.past.length){ const g=L.layerGroup([L.polyline(storm.jma.past,{color:'#555',weight:2,opacity:.6})]); g.addTo(map); layers.__past=g; }
  let tmin=null,tmax=null; const seen=new Set();
  for(const s of SRC){ if(seen.has(s.label)&&s.key!=='jma') continue; const S=series(s.key); if(!S) continue; seen.add(s.label);
    if(on[s.key]===undefined) on[s.key]=DEFAULT_ON.includes(s.key)&&!S.stale;   // 最初は 気象庁・米軍・GEFS 平均 の 3 本（iller 10/22）
    const g=L.layerGroup(); const ll=S.pts.map(p=>[p.lat,p.lon]);
    g.addLayer(L.polyline(ll,{color:s.color,weight:s.width,opacity:S.stale?.45:.9,dashArray:s.dash||null}));
    S.pts.forEach((p,i)=>{ if(s.key==='jma'&&p.r) g.addLayer(L.circle([p.lat,p.lon],{radius:p.r*1000,color:s.color,weight:1,opacity:.6,fillOpacity:.06,dashArray:'4 4'}));
      if(i===S.pts.length-1&&(s.key==='jma'||s.key==='jtwc'||window.innerWidth>600)) g.addLayer(L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',html:`<span class="lbl" style="color:${s.color}">${esc(s.label)}</span>`,iconAnchor:[-6,8]}),interactive:false}));
      if(s.key==='jma'||s.key==='jtwc') g.addLayer(L.circleMarker([p.lat,p.lon],{radius:3.5,color:s.color,fillColor:'#fff',fillOpacity:1,weight:2}).bindTooltip(`${esc(s.label)} ${fmtJ(p.t)}${p.pres?' '+p.pres+'hPa':''}${p.wind?' '+p.wind+'m/s':''}${p.kt&&!p.wind?' '+p.kt+'kt':''}`)); });
    layers[s.key]=g; if(on[s.key]) g.addTo(map);
    const chip=document.createElement('span'); chip.className='chip'+(on[s.key]?'':' off'); chip.innerHTML=`<i style="background:${s.color}${s.dash?';border-top:2px dashed '+s.color+';height:0;background:none':''}"></i>${esc(s.label)} <small>${esc(fmtJ(S.init))}${S.stale?'・古い':''}</small>`;
    chip.onclick=()=>{ on[s.key]=!on[s.key]; chip.classList.toggle('off',!on[s.key]); if(on[s.key]) layers[s.key].addTo(map); else map.removeLayer(layers[s.key]); draw(); };
    chips.appendChild(chip);
    const a=S.pts[0].t,b=S.pts[S.pts.length-1].t; if(!tmin||a<tmin)tmin=a; if(!tmax||b>tmax)tmax=b;
  }
  // 時刻の目盛り：気象庁の実況から 3 時間刻み
  const J=series('jma'); const t0=J?J.pts[0].t:tmin; times=[]; for(let t=new Date(t0);t<=tmax;t=new Date(t.getTime()+3*3600e3)) times.push(new Date(t));
  const sl=document.getElementById('slider'); sl.max=Math.max(0,times.length-1); sl.value=0;
  const tk=document.getElementById('ticks'); tk.innerHTML=times.map((t,i)=>{ const h=t.getHours(); if(h!==0&&h!==12) return ''; const x=times.length>1?i/(times.length-1)*100:0; return h===0?`<div class="tick" style="left:${x}%">${t.getMonth()+1}/${t.getDate()}</div>`:`<div class="tick minor" style="left:${x}%"></div>`; }).join('');
  draw();
  const all=[]; Object.entries(layers).forEach(([k,g])=>{ if(k==='__past'||!on[k])return; g.eachLayer(l=>{ if(l.getLatLngs) all.push(...l.getLatLngs().flat()); }); });
  if(all.length) map.fitBounds(L.latLngBounds(all).pad(window.innerWidth>600?.15:.05));
}
function draw(){
  const t=times[+document.getElementById('slider').value]; if(!t) return;
  document.getElementById('tlabel').textContent=fmtJ(t);
  Object.values(markers).forEach(l=>map.removeLayer(l)); markers={};
  for(const s of SRC){ if(!on[s.key]||!layers[s.key]) continue; const S=series(s.key); if(!S) continue; const p=interp(S.pts,t); if(!p) continue;
    const m=L.circleMarker([p.lat,p.lon],{radius:7,color:'#000',weight:1.5,fillColor:s.color,fillOpacity:1}); m.addTo(map); markers[s.key]=m;
    // 風域：その時刻に予報点がある時だけ（気象庁＝強風域は実況のみ、暴風域／暴風警戒域、JTWC＝34kt・64kt）
    const ex=S.pts.find(q=>Math.abs(q.t-t)<90*60e3); if(!ex) continue;
    if(s.key==='jma'){ const g=windPoly(ex.lat,ex.lon,jmaSectors(ex.gale),{color:'#d9a400',fillColor:'#ffd84d'}); if(g){g.addTo(map);markers['jma_g']=g;} const w=windPoly(ex.lat,ex.lon,jmaSectors(ex.storm),{color:'#d93025',fillColor:'#ff6b5e'}); if(w){w.addTo(map);markers['jma_s']=w;} }
    if(s.key==='jtwc'&&ex.rad){ const g=windPoly(ex.lat,ex.lon,jtwcSectors(ex.rad['34']),{color:'#d9a400',fillColor:'#ffd84d',dashArray:'4 4',fillOpacity:.06}); if(g){g.addTo(map);markers['jtwc_g']=g;} const w=windPoly(ex.lat,ex.lon,jtwcSectors(ex.rad['64']),{color:'#d93025',fillColor:'#ff6b5e',dashArray:'4 4',fillOpacity:.06}); if(w){w.addTo(map);markers['jtwc_s']=w;} } }
}
function pickStorm(i){ storm=data.storms[i]; document.getElementById('ttl').textContent=`台風${+storm.jma.number%100}号 ${storm.jma.name||''}`; document.getElementById('iss').textContent='気象庁 '+fmtJ(new Date(storm.jma.issue))+' 発表'; on={}; build(); }
async function load(){
  const r=await fetch('data.json?nocache='+Date.now()); data=await r.json();
  document.getElementById('upd').textContent='取得 '+data.updated;
  if(!data.storms.length){ document.getElementById('ttl').textContent='台風なし'; return; }
  const pk=document.getElementById('pick'); pk.innerHTML=data.storms.map((s,i)=>`<option value="${i}">台風${+s.jma.number%100}号 ${esc(s.jma.name||'')}</option>`).join(''); pk.style.display=data.storms.length>1?'':'none'; pk.onchange=()=>pickStorm(+pk.value);
  pickStorm(0);
}
map=L.map('map',{zoomControl:true,attributionControl:true}).setView([25,130],5);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:12}).addTo(map);
document.getElementById('slider').addEventListener('input',draw);
load().catch(e=>{ document.getElementById('ttl').textContent='読み込めません'; });
setInterval(load, 30*60*1000);
</script>
</body>
</html>
