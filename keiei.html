<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>経営</title>
<link rel="icon" href="./icons/icon-192.png">
<style>
body{margin:0;font-family:-apple-system,"Hiragino Sans","Meiryo","Yu Gothic UI",sans-serif;font-size:17px;color:#222;background:#f6f7f8}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:8px 12px;display:flex;gap:8px;align-items:center;z-index:2}
header h1{font-size:19px;margin:0 8px 0 0}
header .tabs{display:flex;gap:4px}
header .tabs button{border:1px solid #bbb;background:#fff;padding:4px 12px;border-radius:4px;cursor:pointer;font-weight:600}
header .tabs button.on{background:#2b6;color:#fff;border-color:#2b6}
.fr{width:100%;height:calc(100vh - 54px);border:0;display:block;background:#fff}
.fr.off{display:none}
</style>
</head>
<body>
<header>
  <h1>経営</h1>
  <nav class="tabs"><button class="on" data-t="boss" onclick="showTab('boss')">経営</button><button data-t="pw" onclick="showTab('pw')">PW</button></nav>
</header>
<iframe id="fr_boss" class="fr" title="経営"></iframe>
<iframe id="fr_pw" class="fr off" title="PW管理"></iframe>
<script>
// 経営・PW（10/9 秘書から分離）。鍵は ?bk=（経営の鍵）?dk=（台帳の暗号の鍵）で一度だけ受け取り、端末の localStorage に置く。
// リポジトリには入れない。受け取ったら URL から消す（履歴・ブックマークに残さない）。中身は boss.html / pw.html。
try{ var _q=new URLSearchParams(location.search), _bk=_q.get('bk'), _dk=_q.get('dk');
  if(_bk) localStorage.setItem('sec_bk',_bk); if(_dk) localStorage.setItem('sec_dk',_dk);
  if(_bk||_dk){ _q.delete('bk'); _q.delete('dk'); history.replaceState(null,'',location.pathname+(_q.toString()?'?'+_q.toString():'')); }
}catch(e){}
function showTab(t){
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
  ['boss','pw'].forEach(function(n){var f=document.getElementById('fr_'+n); f.classList.toggle('off',t!==n); if(t===n&&!f.src) f.src=n+'.html?v='+Date.now();});
  try{localStorage.setItem('keiei_tab',t)}catch(e){}
}
var _t='boss'; try{ _t=localStorage.getItem('keiei_tab')||'boss'; }catch(e){}
showTab(_t==='pw'?'pw':'boss');
</script>
</body>
</html>
