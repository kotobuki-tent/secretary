<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>社用携帯</title>
<!-- 社用携帯の一覧（2026-11-11）。秘書アプリの「携帯」タブ。データは GAS プロジェクト「秘書」のシート phones。
     見られるのは合言葉（?k=、localStorage sec_k）を持つ端末＝iller・社長・遠藤未来。このファイルに合言葉は無い。 -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap');
:root{--text:#222;--dim:#777;--border:#e4e4e4;--accent:#5550b4;--accent-dim:#ecebf8;--red:#c33;--red-dim:#fbeaea;--green:#1a7a3a}
body{margin:0;background:#f6f7f8;color:var(--text);font:15px/1.45 'Hiragino Sans','Noto Sans JP',sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:12px 12px 60px;box-sizing:border-box}
.bar{display:flex;gap:8px;align-items:center;margin:0 0 10px}
.bar .st{color:var(--dim);font-size:13px;margin-right:auto}
.bar .st.ng{color:var(--red)}.bar .st.ok{color:var(--green)}
button{font:inherit;font-weight:400;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;background:var(--accent-dim);color:var(--accent)}
button.sub{background:#ececef;color:#333}
button:disabled{opacity:.45;cursor:default}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:6px;overflow:hidden}
th{font-weight:500;font-size:13px;color:var(--dim);text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);background:#fbfbfb;white-space:nowrap}
td{padding:0;border-bottom:1px solid #f0f0f0}
tr:last-child td{border-bottom:0}
td input{width:100%;box-sizing:border-box;border:0;background:transparent;font:inherit;color:inherit;padding:8px;outline:0;border-radius:0}
td input:focus{background:var(--accent-dim)}
td.no{width:64px}td.tel{width:150px}td.pin{width:110px}td.user{width:150px}td.acc{width:230px}
td.no input,td.pin input{text-align:center}
tr.chg td{background:#fffbea}
.empty{color:#999;font-size:14px;padding:2em 0}
@media(max-width:640px){
  table,tbody,tr,td{display:block;width:auto}thead{display:none}
  table{border:0;background:transparent}
  tr{background:#fff;border:1px solid var(--border);border-radius:8px;margin:0 0 8px;padding:4px 0}
  td{border:0;display:flex;align-items:center}td::before{content:attr(data-l);flex:0 0 124px;color:var(--dim);font-size:13px;padding-left:10px}
  td.no,td.tel,td.pin,td.user,td.acc{width:auto}td.no input,td.pin input{text-align:left}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><span class="st" id="st"></span><button class="sub" id="add" onclick="addRow()">行を足す</button><button id="save" onclick="save()" disabled>保存</button></div>
  <div id="box"><p class="empty">読み込み中…</p></div>
</div>
<script>
var API='https://script.google.com/macros/s/AKfycbz1HO0bfr65_IhCisT4Q-zR6YZ-mQUEdRx7qfSqHLLoeVsVPCeaL48dn0b9w1xtfYUS/exec';
var K=''; try{K=localStorage.getItem('sec_k')||''}catch(e){}
var COLS=[['no','管理番号'],['user','使用者'],['tel','電話番号'],['account','Googleアカウント'],['pin','PINコード'],['note','備考']];
var CLS={no:'no',user:'user',tel:'tel',account:'acc',pin:'pin',note:'note'};
var ROWS=[],AT='',DIRTY=false,BUSY=false;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function st(t,c){var e=document.getElementById('st');e.textContent=t||'';e.className='st'+(c?' '+c:'')}
function dirty(f){DIRTY=f;document.getElementById('save').disabled=!f||BUSY}
function render(){
  var h='<table><thead><tr>'+COLS.map(function(c){return '<th>'+c[1]+'</th>'}).join('')+'</tr></thead><tbody>';
  ROWS.forEach(function(r,i){
    h+='<tr>'+COLS.map(function(c){
      var k=c[0],mode=(k==='no'||k==='pin')?' inputmode="numeric"':(k==='tel'?' inputmode="tel"':(k==='account'?' inputmode="email" autocapitalize="off"':''));
      return '<td class="'+CLS[k]+'" data-l="'+c[1]+'"><input value="'+esc(r[k])+'" data-i="'+i+'" data-k="'+k+'"'+mode+' autocomplete="off" spellcheck="false"></td>'}).join('')+'</tr>'});
  h+='</tbody></table>';
  document.getElementById('box').innerHTML=ROWS.length?h:'<p class="empty">まだ何も入っていません</p>';
}
document.addEventListener('input',function(e){var t=e.target;if(!t.dataset||t.dataset.i==null)return;ROWS[+t.dataset.i][t.dataset.k]=t.value;t.closest('tr').classList.add('chg');dirty(true);st('')});
function addRow(){var o={};COLS.forEach(function(c){o[c[0]]=''});ROWS.push(o);render();var ins=document.querySelectorAll('#box tbody tr:last-child input');if(ins[1])ins[1].focus()}
function load(){
  if(!K){document.getElementById('box').innerHTML='<p class="empty">合言葉がありません</p>';document.getElementById('add').disabled=true;return}
  st('読み込み中…');
  fetch(API+'?k='+encodeURIComponent(K)+'&a=phones&t='+Date.now()).then(function(r){return r.json()}).then(function(j){
    if(j.error){st(j.error,'ng');return}
    ROWS=j.rows||[];AT=j.at||'';render();dirty(false);st(AT?'最終保存 '+AT.slice(0,16):'')
  }).catch(function(){st('読み込めませんでした','ng')});
}
function save(){
  if(BUSY||!DIRTY)return; BUSY=true; document.getElementById('save').disabled=true; st('保存中…');
  var rows=ROWS.filter(function(r){return COLS.some(function(c){return String(r[c[0]]||'').trim()!==''})}).map(function(r){var o={};COLS.forEach(function(c){o[c[0]]=String(r[c[0]]||'').trim()});return o});
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:K,action:'phones_save',rows:rows,base:AT})}).then(function(r){return r.json()}).then(function(j){
    BUSY=false;
    if(j.conflict){st('ほかの人が先に保存しています。読み直してください','ng');document.getElementById('save').disabled=false;return}
    if(!j.ok){st('保存できませんでした','ng');document.getElementById('save').disabled=false;return}
    ROWS=rows;AT=j.at||'';render();dirty(false);st('保存しました '+AT.slice(0,16),'ok')
  }).catch(function(){BUSY=false;document.getElementById('save').disabled=false;st('保存できませんでした','ng')});
}
window.addEventListener('beforeunload',function(e){if(DIRTY){e.preventDefault();e.returnValue=''}});
load();
</script>
</body>
</html>
